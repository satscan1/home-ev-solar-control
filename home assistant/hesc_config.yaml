    mode: box
  hesc_advice_min_runs:
    name: "HESC advice minimum sessions"
    min: 3
    max: 50
    step: 1
    icon: mdi:counter
    mode: box
  hesc_ev_active_w:
    name: "HESC EV charging threshold"
    min: 100
    max: 3000
    step: 50
    unit_of_measurement: "W"
    icon: mdi:flash
    mode: box

template:
  # Diagnostic mirrors of the selected sources (same idea as the hpvc_diag_* sensors).
  # They follow whatever entity is selected in Settings, convert kW to W, and give
  # the dashboard graphs one fixed set of entity ids for every installation.
  # The power sensors update once per minute to keep recorder writes low.
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
    sensor:
      - name: "HESC diag PV power"
        unique_id: hesc_diag_pv_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ states(states('input_text.hesc_pv_power_sensor')) | is_number }}"
        state: >
          {% set e = states('input_text.hesc_pv_power_sensor') %}
          {% set k = 1000 if (state_attr(e, 'unit_of_measurement') | string | lower) == 'kw' else 1 %}
          {{ (states(e) | float(0) * k) | round(0) }}
      - name: "HESC diag EV power"
        unique_id: hesc_diag_ev_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ states(states('input_text.hesc_ev_power_sensor')) | is_number }}"
        state: >
          {% set e = states('input_text.hesc_ev_power_sensor') %}
          {% set k = 1000 if (state_attr(e, 'unit_of_measurement') | string | lower) == 'kw' else 1 %}
          {{ (states(e) | float(0) * k) | round(0) }}
      - name: "HESC diag forecast power"
        unique_id: hesc_diag_forecast_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ states(states('input_text.hesc_forecast_now_sensor')) | is_number }}"
        state: "{{ states(states('input_text.hesc_forecast_now_sensor')) | float(0) | round(0) }}"
      - name: "HESC diag forecast cautious"
        unique_id: hesc_diag_forecast_cautious
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {% set e = states('input_text.hesc_forecast_now_sensor') %}
          {% set a = states('input_text.hesc_forecast_attribute') %}
          {{ (state_attr(e, a) if a not in ['', 'unknown', 'unavailable'] else states(e)) | is_number }}
        state: >
          {% set e = states('input_text.hesc_forecast_now_sensor') %}
          {% set a = states('input_text.hesc_forecast_attribute') %}
          {{ ((state_attr(e, a) if a not in ['', 'unknown', 'unavailable'] else states(e)) | float(0)) | round(0) }}
      - name: "HESC diag irradiance"
        unique_id: hesc_diag_irradiance
        unit_of_measurement: "W/m²"
        state_class: measurement
        availability: "{{ is_state('input_boolean.hesc_use_irradiance', 'on') and states(states('input_text.hesc_irradiance_sensor')) | is_number }}"
        state: "{{ states(states('input_text.hesc_irradiance_sensor')) | float(0) | round(0) }}"
  - binary_sensor:
      - name: "HESC diag EV connected"
        unique_id: hesc_diag_ev_connected
        icon: mdi:ev-plug-type2
        state: >
          {% set e = states('input_text.hesc_ev_connected_sensor') %}
          {% set s = states(e) | string %}
          {% set dv = states('input_text.hesc_ev_disconnected_values') %}
          {% set off = (dv if dv not in ['', 'unknown', 'unavailable'] else 'off,disconnected,ready,available,no_ev_connected,unplugged,not_connected,no car,idle,ev disconnected') | lower %}
          {% if e.split('.')[0] in ['binary_sensor', 'switch', 'input_boolean'] %}
            {{ s == 'on' }}
          {% else %}
            {{ s not in ['unknown', 'unavailable', ''] and (s | lower) not in (off.split(',') | map('trim') | list) }}
          {% endif %}
      - name: "HESC diag charger solar mode"
        unique_id: hesc_diag_charger_solar_mode
        icon: mdi:solar-power
        state: >
          {% set m = states(states('input_text.hesc_charger_mode_entity')) | string | lower %}
          {% set ev = states('input_text.hesc_charger_eco_value') %}
          {% set vals = ((ev if ev not in ['', 'unknown', 'unavailable'] else 'eco_mode') | lower).split(',') | map('trim') | list %}
          {% set sw = states('input_text.hesc_charger_solar_switch_entity') %}
          {{ m in vals and (sw in ['', 'unknown', 'unavailable'] or is_state(sw, 'on')) }}
      - name: "HESC diag release active"
        unique_id: hesc_diag_release_active
        icon: mdi:lock-open-variant-outline
        state: "{{ 'Release' in states('input_text.hesc_state') }}"

  # Setup check (same idea as binary_sensor.hpvc_configuration_valid).
  # On only when every essential source is filled in and exists. Only checks that
  # entities exist, not their current value, so a short outage does not hide the dashboard.
  - binary_sensor:
      - name: "HESC configuration valid"
        unique_id: hesc_configuration_valid
        icon: mdi:clipboard-check-outline
        state: >
          {% set ok = namespace(v=true) %}
          {% for f in ['hesc_ev_connected_sensor', 'hesc_ev_power_sensor', 'hesc_charger_mode_entity', 'hesc_pv_power_sensor', 'hesc_forecast_now_sensor', 'hesc_hpvc_enabled_entity', 'hesc_hpvc_limited_entity'] %}
            {% set e = states('input_text.' ~ f) | trim %}
            {% if e in ['', 'unknown', 'unavailable'] or (states(e) == 'unknown' and state_attr(e, 'friendly_name') is none) %}{% set ok.v = false %}{% endif %}
          {% endfor %}
          {{ ok.v and (states('input_text.hesc_charger_eco_value') | trim) not in ['', 'unknown', 'unavailable'] }}

input_button:
  hesc_generate_report:
    name: "HESC Generate report"
    icon: mdi:file-document-plus-outline

automation:
  # PV and grid power are taken over from HPVC, so a new user does not have to pick them twice.
  # Switch 'Use HPVC sensors' off in Settings to choose other sensors.
  - id: hesc_sync_sources_from_hpvc
    alias: "HESC - Take over PV and grid sensors from HPVC"
    mode: queued
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_text.hpvc_pv_power_sensor
          - input_text.hpvc_grid_power_sensor
      - trigger: state
        entity_id: input_boolean.hesc_use_hpvc_sources
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.hesc_use_hpvc_sources
        state: "on"
    actions:
      - variables:
          pv: "{{ states('input_text.hpvc_pv_power_sensor') | trim }}"
          grid: "{{ states('input_text.hpvc_grid_power_sensor') | trim }}"
      - if: "{{ pv not in ['', 'unknown', 'unavailable'] and pv != states('input_text.hesc_pv_power_sensor') }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hesc_pv_power_sensor }
            data: { value: "{{ pv }}" }
      - if: "{{ grid not in ['', 'unknown', 'unavailable'] and grid != states('input_text.hesc_grid_power_sensor') }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hesc_grid_power_sensor }
            data: { value: "{{ grid }}" }

  # Same pattern as HPVC: opening the report resets the tile to "Generate report".
  - id: hesc_reset_report_after_view
    alias: "HESC - Reset report after viewing"
    description: "Resets the report tile to Generate report when the generated HTML report is opened."
    mode: restart
    triggers:
      - trigger: webhook
        webhook_id: hesc_report_viewed
        allowed_methods: [POST]
        local_only: false
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hesc_report_ready

  # Same pattern as HPVC: sensible defaults only once, on first install.
  - id: hesc_apply_defaults_on_first_install
    alias: "HESC - Apply defaults on first install"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_boolean.hesc_defaults_applied
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.hesc_defaults_applied
        state: "off"
    actions:
      - delay: "00:00:10"
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.hesc_enabled
            - input_boolean.hesc_shadow_mode
            - input_boolean.hesc_use_hpvc_sources
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.hesc_owns_hpvc_off
            - input_boolean.hesc_use_irradiance
      - action: input_text.set_value
        target: { entity_id: input_text.hesc_forecast_now_sensor }
        data: { value: "sensor.solcast_pv_forecast_power_now" }
      - action: input_text.set_value
        target: { entity_id: input_text.hesc_forecast_30m_sensor }
        data: { value: "sensor.solcast_pv_forecast_power_in_30_minutes" }
      - action: input_text.set_value
        target: { entity_id: input_text.hesc_forecast_attribute }
        data: { value: "estimate10" }
      - action: input_text.set_value
        target: { entity_id: input_text.hesc_charger_eco_value }
        data: { value: "eco_mode" }
      - action: input_text.set_value
        target: { entity_id: input_text.hesc_hpvc_enabled_entity }
        data: { value: "input_boolean.hpvc_enabled" }
      - action: input_text.set_value
        target: { entity_id: input_text.hesc_hpvc_limited_entity }
        data: { value: "binary_sensor.hpvc_pv_limited" }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_p_start }
        data: { value: 2500 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_p_hold }
        data: { value: 2000 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_irr_start }
        data: { value: 400 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_irr_hold }
        data: { value: 300 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_t_stable }
        data: { value: 5 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_t_start }
        data: { value: 10 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_t_dip }
        data: { value: 5 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_t_stop }
        data: { value: 5 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_t_max }
        data: { value: 240 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_cooldown }
        data: { value: 30 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_max_attempts }
        data: { value: 3 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_ev_active_w }
        data: { value: 400 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_advice_window_days }
        data: { value: 30 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_advice_min_runs }
        data: { value: 8 }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.hesc_defaults_applied }
