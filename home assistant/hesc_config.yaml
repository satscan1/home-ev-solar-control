          {%- macro bad(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none or states(e) == 'unavailable' }}{%- endmacro -%}{%- macro gone(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none }}{%- endmacro -%}
          {%- set ns = namespace(m=[]) -%}
          {%- if bad(states('input_text.hesc_pv_power_sensor') | trim) == 'True' -%}{%- set ns.m = ns.m + ['PV power sensor'] -%}{%- endif -%}
          {%- set g = states('input_text.hesc_grid_power_sensor') | trim -%}
          {%- if g not in ['', 'unknown'] and bad(g) == 'True' -%}{%- set ns.m = ns.m + ['grid power sensor'] -%}{%- endif -%}
          {%- set fc = states('input_text.hesc_forecast_now_sensor') | trim -%}{%- set fa = states('input_text.hesc_forecast_attribute') | trim -%}
          {%- if bad(fc) == 'True' or (fa not in ['', 'unknown', 'unavailable'] and state_attr(fc, fa) is none) -%}{%- set ns.m = ns.m + ['solar forecast'] -%}{%- endif -%}
          {%- if is_state('input_boolean.hesc_standalone', 'off') -%}
          {%- for t in ['input_text.hesc_hpvc_enabled_entity', 'input_text.hesc_hpvc_limited_entity'] -%}
          {%- if bad(states(t) | trim) == 'True' and 'HPVC entities' not in ns.m -%}{%- set ns.m = ns.m + ['HPVC entities'] -%}{%- endif -%}
          {%- endfor -%}
          {%- endif -%}
          {{ ns.m | count == 0 }}
        attributes:
          missing: >-
            {%- macro bad(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none or states(e) == 'unavailable' }}{%- endmacro -%}{%- macro gone(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none }}{%- endmacro -%}
            {%- set ns = namespace(m=[]) -%}
            {%- if bad(states('input_text.hesc_pv_power_sensor') | trim) == 'True' -%}{%- set ns.m = ns.m + ['PV power sensor'] -%}{%- endif -%}
            {%- set g = states('input_text.hesc_grid_power_sensor') | trim -%}
            {%- if g not in ['', 'unknown'] and bad(g) == 'True' -%}{%- set ns.m = ns.m + ['grid power sensor'] -%}{%- endif -%}
            {%- set fc = states('input_text.hesc_forecast_now_sensor') | trim -%}{%- set fa = states('input_text.hesc_forecast_attribute') | trim -%}
            {%- if bad(fc) == 'True' or (fa not in ['', 'unknown', 'unavailable'] and state_attr(fc, fa) is none) -%}{%- set ns.m = ns.m + ['solar forecast'] -%}{%- endif -%}
            {%- if is_state('input_boolean.hesc_standalone', 'off') -%}
            {%- for t in ['input_text.hesc_hpvc_enabled_entity', 'input_text.hesc_hpvc_limited_entity'] -%}
            {%- if bad(states(t) | trim) == 'True' and 'HPVC entities' not in ns.m -%}{%- set ns.m = ns.m + ['HPVC entities'] -%}{%- endif -%}
            {%- endfor -%}
            {%- endif -%}
            {{ ns.m | join(', ') }}
      - name: "HESC check weather station"
        unique_id: hesc_check_weather
        icon: mdi:weather-sunny
        state: >-
          {%- macro bad(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none or states(e) == 'unavailable' }}{%- endmacro -%}{%- macro gone(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none }}{%- endmacro -%}
          {%- set ns = namespace(m=[]) -%}
          {%- if is_state('input_boolean.hesc_use_irradiance', 'on') -%}
          {%- set e = states('input_text.hesc_irradiance_sensor') | trim -%}
          {%- if bad(e) == 'True' or states(e) | float(none) is none -%}{%- set ns.m = ns.m + ['irradiance sensor'] -%}{%- endif -%}
          {%- endif -%}
          {{ ns.m | count == 0 }}
        attributes:
          missing: >-
            {%- macro bad(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none or states(e) == 'unavailable' }}{%- endmacro -%}{%- macro gone(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none }}{%- endmacro -%}
            {%- set ns = namespace(m=[]) -%}
            {%- if is_state('input_boolean.hesc_use_irradiance', 'on') -%}
            {%- set e = states('input_text.hesc_irradiance_sensor') | trim -%}
            {%- if bad(e) == 'True' or states(e) | float(none) is none -%}{%- set ns.m = ns.m + ['irradiance sensor'] -%}{%- endif -%}
            {%- endif -%}
            {{ ns.m | join(', ') }}
      - name: "HESC check charge plan"
        unique_id: hesc_check_plan
        icon: mdi:calendar-clock
        state: >-
          {%- macro bad(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none or states(e) == 'unavailable' }}{%- endmacro -%}{%- macro gone(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none }}{%- endmacro -%}
          {%- set ns = namespace(m=[]) -%}
          {%- set ss = states('input_text.hesc_charger_start_stop_entity') | trim -%}{%- set gm = states('input_text.hesc_charger_grid_mode_value') | trim -%}
          {%- if gone(ss) == 'True' and gm in ['', 'unknown', 'unavailable'] -%}{%- set ns.m = ns.m + ['start/stop switch or charge-now value'] -%}{%- endif -%}
          {%- set rs = states('input_text.hesc_charger_resume_entity') | trim -%}
          {%- if rs not in ['', 'unknown'] and gone(rs) == 'True' -%}{%- set ns.m = ns.m + ['back-to-solar entity'] -%}{%- endif -%}
          {%- set p = states('input_text.hesc_price_sensor') | trim -%}
          {%- if bad(p) == 'True' or state_attr(p, 'raw_today') is none -%}{%- set ns.m = ns.m + ['price sensor'] -%}{%- endif -%}
          {%- if bad(states('input_text.hesc_solar_today_sensor') | trim) == 'True' -%}{%- set ns.m = ns.m + ['solar forecast today'] -%}{%- endif -%}
          {{ ns.m | count == 0 }}
        attributes:
          missing: >-
            {%- macro bad(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none or states(e) == 'unavailable' }}{%- endmacro -%}{%- macro gone(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none }}{%- endmacro -%}
            {%- set ns = namespace(m=[]) -%}
            {%- set ss = states('input_text.hesc_charger_start_stop_entity') | trim -%}{%- set gm = states('input_text.hesc_charger_grid_mode_value') | trim -%}
            {%- if gone(ss) == 'True' and gm in ['', 'unknown', 'unavailable'] -%}{%- set ns.m = ns.m + ['start/stop switch or charge-now value'] -%}{%- endif -%}
            {%- set rs = states('input_text.hesc_charger_resume_entity') | trim -%}
            {%- if rs not in ['', 'unknown'] and gone(rs) == 'True' -%}{%- set ns.m = ns.m + ['back-to-solar entity'] -%}{%- endif -%}
            {%- set p = states('input_text.hesc_price_sensor') | trim -%}
            {%- if bad(p) == 'True' or state_attr(p, 'raw_today') is none -%}{%- set ns.m = ns.m + ['price sensor'] -%}{%- endif -%}
            {%- if bad(states('input_text.hesc_solar_today_sensor') | trim) == 'True' -%}{%- set ns.m = ns.m + ['solar forecast today'] -%}{%- endif -%}
            {{ ns.m | join(', ') }}
      - name: "HESC check home battery and EV"
        unique_id: hesc_check_kick
        icon: mdi:battery-arrow-up-outline
        state: >-
          {%- macro bad(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none or states(e) == 'unavailable' }}{%- endmacro -%}{%- macro gone(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none }}{%- endmacro -%}
          {%- set ns = namespace(m=[]) -%}
          {%- if is_state('input_boolean.hesc_kick_enabled', 'on') -%}
          {%- set socs = (states('input_text.hesc_home_battery_soc_sensors') | trim).split(',') | map('trim') | reject('in', ['', 'unknown', 'unavailable']) | list -%}
          {%- set pws = (states('input_text.hesc_home_battery_power_sensors') | trim).split(',') | map('trim') | reject('in', ['', 'unknown', 'unavailable']) | list -%}
          {%- if socs | count == 0 or socs | select('is_state', 'unavailable') | list | count > 0 or socs | map('state_attr', 'friendly_name') | select('none') | list | count > 0 -%}{%- set ns.m = ns.m + ['home battery level sensors'] -%}{%- endif -%}
          {%- if pws | count == 0 or pws | select('is_state', 'unavailable') | list | count > 0 or pws | map('state_attr', 'friendly_name') | select('none') | list | count > 0 -%}{%- set ns.m = ns.m + ['home battery power sensors'] -%}{%- endif -%}
          {%- if states('input_number.hesc_home_battery_kwh') | float(0) <= 0 -%}{%- set ns.m = ns.m + ['home battery size'] -%}{%- endif -%}
          {%- set ss = states('input_text.hesc_charger_start_stop_entity') | trim -%}
          {%- if gone(ss) == 'True' or ss.startswith('button.') -%}{%- set ns.m = ns.m + ['start/stop switch (Charge plan)'] -%}{%- endif -%}
          {%- if gone(states('input_text.hesc_charger_resume_entity') | trim) == 'True' -%}{%- set ns.m = ns.m + ['back-to-solar entity (Charge plan)'] -%}{%- endif -%}
          {%- endif -%}
          {{ ns.m | count == 0 }}
        attributes:
          missing: >-
            {%- macro bad(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none or states(e) == 'unavailable' }}{%- endmacro -%}{%- macro gone(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none }}{%- endmacro -%}
            {%- set ns = namespace(m=[]) -%}
            {%- if is_state('input_boolean.hesc_kick_enabled', 'on') -%}
            {%- set socs = (states('input_text.hesc_home_battery_soc_sensors') | trim).split(',') | map('trim') | reject('in', ['', 'unknown', 'unavailable']) | list -%}
            {%- set pws = (states('input_text.hesc_home_battery_power_sensors') | trim).split(',') | map('trim') | reject('in', ['', 'unknown', 'unavailable']) | list -%}
            {%- if socs | count == 0 or socs | select('is_state', 'unavailable') | list | count > 0 or socs | map('state_attr', 'friendly_name') | select('none') | list | count > 0 -%}{%- set ns.m = ns.m + ['home battery level sensors'] -%}{%- endif -%}
            {%- if pws | count == 0 or pws | select('is_state', 'unavailable') | list | count > 0 or pws | map('state_attr', 'friendly_name') | select('none') | list | count > 0 -%}{%- set ns.m = ns.m + ['home battery power sensors'] -%}{%- endif -%}
            {%- if states('input_number.hesc_home_battery_kwh') | float(0) <= 0 -%}{%- set ns.m = ns.m + ['home battery size'] -%}{%- endif -%}
            {%- set ss = states('input_text.hesc_charger_start_stop_entity') | trim -%}
            {%- if gone(ss) == 'True' or ss.startswith('button.') -%}{%- set ns.m = ns.m + ['start/stop switch (Charge plan)'] -%}{%- endif -%}
            {%- if gone(states('input_text.hesc_charger_resume_entity') | trim) == 'True' -%}{%- set ns.m = ns.m + ['back-to-solar entity (Charge plan)'] -%}{%- endif -%}
            {%- endif -%}
            {{ ns.m | join(', ') }}
  # v1.4.0: expected cost of the active charge plan (grid kWh x average planned price), for the badge on Main
  - sensor:
      - name: "HESC expected charge cost"
        unique_id: hesc_planned_cost
        icon: mdi:cash-clock
        unit_of_measurement: "EUR"
        device_class: monetary
        state: >-
          {%- set raw = state_attr('sensor.hesc_charge_plan', 'plan') -%}
          {%- set P = (raw | from_json if raw is string else raw) or {} -%}
          {%- if P.get('active') -%}{{ ((P.get('grid_kwh') | float(0)) * (P.get('avg_price_ct') | float(0)) / 100) | round(2) }}{%- else -%}0{%- endif -%}
        attributes:
          grid_kwh: >-
            {%- set raw = state_attr('sensor.hesc_charge_plan', 'plan') -%}{%- set P = (raw | from_json if raw is string else raw) or {} -%}{{ P.get('grid_kwh') | float(0) | round(1) }}
          avg_price_ct: >-
            {%- set raw = state_attr('sensor.hesc_charge_plan', 'plan') -%}{%- set P = (raw | from_json if raw is string else raw) or {} -%}{{ P.get('avg_price_ct') }}
          ready_by: >-
            {%- set raw = state_attr('sensor.hesc_charge_plan', 'plan') -%}{%- set P = (raw | from_json if raw is string else raw) or {} -%}{{ P.get('deadline_text') if P.get('active') else 'no active plan' }}
          partly_expected_prices: >-
            {%- set raw = state_attr('sensor.hesc_charge_plan', 'plan') -%}{%- set P = (raw | from_json if raw is string else raw) or {} -%}{{ (P.get('planned_forecast') or []) | count > 0 }}

input_button:
  hesc_generate_report:
    name: "HESC Generate report"
    icon: mdi:file-document-plus-outline
  hesc_charger_search:
    name: "HESC search charger entities again"
    icon: mdi:magnify

# --- Charge plan ---
input_datetime:
  hesc_plan_deadline:
    name: "HESC charge plan ready by"
    has_date: true
    has_time: true
    icon: mdi:calendar-clock

# Charger type: fills the brand-specific values and suggests the charger entities.
# The data per charger lives in one place: sensor.hesc_charger_profile (template section).
input_select:
  # --- Charge plan ---
  hesc_plan_day:
    name: "HESC charge plan day"
    options: ["Today", "Tomorrow", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
