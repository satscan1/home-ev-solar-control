# =============================================================================
# Home EV Solar Control (HESC) — Home Assistant package 
# Version: v1.4.0 (2026-10-07)
# Project tag: [WALLBOX] [PV] 
#
# Works alongside Home PV Control (HPVC):
# when the EV waits in solar/Eco charging mode and enough solar power is
# forecast, HESC asks HPVC (v1.5.1+) for a temporary PV release so the charger
# can start on sun. Optional charge plan: charge to a goal by a set time in the
# cheapest quarters (known day-ahead prices first, then HESC's own price forecast),
# counting on expected sun, with a final check and a notification if the goal is
# not reached. Optional minimum charge and cheap chances (skipped when the sun will
# do the job). Runs without HPVC too (standalone). Node-RED flow: hesc_flow.json.
# Shadow mode (default ON) evaluates only: no release requests, no charger writes.
# =============================================================================

input_boolean:
  # Standalone: run HEVS without Home PV Control (HPVC). Off = HPVC installed (release via HPVC).
  # On = no HPVC: HPVC fields not needed, no release step; the charger starts on solar by itself.
  hesc_standalone:
    name: "HESC run without HPVC (standalone)"
    icon: mdi:link-variant-off
  # Charge plan: set while HESC itself started grid charging (restart safety)
  # Settings: show the charge plan block (step 3)
  hesc_show_plan_settings:
    name: "HESC show charge plan settings"
    icon: mdi:calendar-clock
  hesc_plan_owns_charging:
    name: "HESC charge plan owns charging"
    icon: mdi:ev-station
  # Fallback to the old release method (switch HPVC off + set inverters to full). Default off = use the HPVC external release request.
  hesc_release_legacy:
    name: HESC release via HPVC off (legacy fallback)
    icon: mdi:backup-restore
  hesc_rep_enabled:
    name: "HESC repeating plan"
    icon: mdi:calendar-sync
  hesc_rep_mon:
    name: "HESC repeating plan Monday"
    icon: mdi:calendar-week
  hesc_rep_tue:
    name: "HESC repeating plan Tuesday"
    icon: mdi:calendar-week
  hesc_rep_wed:
    name: "HESC repeating plan Wednesday"
    icon: mdi:calendar-week
  hesc_rep_thu:
    name: "HESC repeating plan Thursday"
    icon: mdi:calendar-week
  hesc_rep_fri:
    name: "HESC repeating plan Friday"
    icon: mdi:calendar-week
  hesc_rep_sat:
    name: "HESC repeating plan Saturday"
    icon: mdi:calendar-week
  hesc_rep_sun:
    name: "HESC repeating plan Sunday"
    icon: mdi:calendar-week
  hesc_plan_opportunity:
    name: "HESC charge plan: take cheap chances"
    icon: mdi:lightning-bolt-circle
  # --- Charge plan ---
  hesc_plan_enabled:
    name: "HESC charge plan"
    icon: mdi:calendar-check
  hesc_plan_allow_grid:
    name: "HESC charge plan may use cheap grid power"
    icon: mdi:transmission-tower
  hesc_enabled:
    name: "HESC enabled"
    icon: mdi:ev-station
  hesc_shadow_mode:
    name: "HESC shadow mode (evaluate only)"
    icon: mdi:ghost-outline
  hesc_use_irradiance:
    name: "HESC local weather station"
    icon: mdi:white-balance-sunny
  hesc_owns_hpvc_off:
    name: "HESC switched HPVC off (ownership)"
    icon: mdi:key-variant
  hesc_defaults_applied:
    name: "HESC defaults applied"
    icon: mdi:check-decagram
  # v1.2.0: set once, when the new v1.2.0 settings got their starting values (new install or upgrade)
  hesc_defaults_v120_applied:
    name: "HESC v1.2.0 defaults applied"
    icon: mdi:check-decagram
  hesc_report_ready:
    name: "HESC report ready"
    icon: mdi:file-document-check-outline
  # --- simplified Settings screen ---
  hesc_use_hpvc_sources:
    name: "HESC use HPVC sensors for PV and grid"
    icon: mdi:link-variant
  hesc_edit_sources:
    name: "HESC change automatic sources"
    icon: mdi:pencil-outline
  hesc_show_optional:
    name: "HESC show optional charger fields"
    icon: mdi:tune-variant
  hesc_show_thresholds:
    name: "HESC show thresholds"
    icon: mdi:tune-vertical
  hesc_show_weather_settings:
    name: "HESC show weather station settings"
    icon: mdi:tune-vertical
  # Minimum charge (optional): keep at least this battery level in the EV (Use + Settings on the Settings page)
  hesc_min_charge_enabled:
    name: "HESC minimum charge"
    icon: mdi:battery-lock
  hesc_show_min_charge_settings:
    name: "HESC show minimum charge settings"
    icon: mdi:tune-vertical
  hesc_defaults_min_charge_applied:
    name: "HESC minimum charge defaults applied"
    icon: mdi:check-decagram
  hesc_show_timing:
    name: "HESC show timing"
    icon: mdi:timer-cog-outline
  hesc_show_advice:
    name: "HESC show advice settings"
    icon: mdi:lightbulb-on-outline
  # v1.4.0: home battery <-> EV. With enough sun left today for the home batteries,
  # HESC gives the charger a short kick (start, pause, back to solar) so it takes the surplus before the home
  # batteries do. When the sun left today is only just enough to fill the home batteries, the EV is paused
  # and the charger goes back to waiting for sun, so the home batteries can charge.
  hesc_kick_enabled:
    name: "HESC home battery and EV (kickstart)"
    icon: mdi:battery-arrow-up-outline
  # v1.4.0: Settings — open the charger fields / the home battery and EV settings
  # (they also open by themselves when the configuration check finds a problem)
  hesc_show_charger_fields:
    name: "HESC show charger fields"
    icon: mdi:form-textbox
  hesc_show_kick_settings:
    name: "HESC show home battery and EV settings"
    icon: mdi:tune-vertical

input_text:
  # Charge plan: fill in ONE of these. A start/stop switch (on = charge; afterwards back to its previous state)
  # or the value of the charger mode entity that means "charge now" (afterwards back to the previous mode)
  hesc_charger_start_stop_entity:
    name: "HESC charger start/stop entity"
    max: 255
  # v1.4.0: button/switch that puts the charger back in its own (solar) mode after grid charging
  # (Wallbox: "resume schedule" = "Resume" in the Wallbox app; the start/stop switch = "Start")
  hesc_charger_resume_entity:
    name: "HESC charger back-to-solar entity"
    max: 255
  hesc_charger_grid_mode_value:
    name: "HESC charger 'charge now' mode value"
    max: 100
  hesc_plan_status:
    name: "HESC charge plan status"
    max: 255
  # Charge plan: day-ahead price sensor with raw_today / raw_tomorrow (e.g. Nord Pool)
  hesc_price_sensor:
    name: "HESC day-ahead price sensor"
    max: 255
  # Charge plan: solar forecast per half hour (Solcast detailedForecast), one for today and one for tomorrow
  hesc_solar_today_sensor:
    name: "HESC solar forecast today (charge plan)"
    max: 255
  hesc_solar_tomorrow_sensor:
    name: "HESC solar forecast tomorrow (charge plan)"
    max: 255
  # Home Assistant notify services for the charge plan goal check, comma separated (e.g. notify.mobile_app_phone).
  # Empty = only a notification inside Home Assistant.
  hesc_notify_services:
    name: "HESC notify services"
    max: 255
  # --- source selection ---
  hesc_forecast_now_sensor:
    name: "HESC forecast power now (sensor)"
    max: 255
  hesc_forecast_30m_sensor:
    name: "HESC forecast power +30 min (sensor)"
    max: 255
  hesc_forecast_attribute:
    name: "HESC forecast attribute (empty = state)"
    max: 64
  hesc_irradiance_sensor:
    name: "HESC irradiance sensor (optional)"
    max: 255
  hesc_pv_power_sensor:
    name: "HESC PV power sensor"
    max: 255
  hesc_grid_power_sensor:
    name: "HESC grid power sensor"
    max: 255
  # Own PV/grid sensors, kept while "PV & grid from HPVC" is on and put back when it is switched off.
  hesc_own_pv_power_sensor:
    name: "HESC own PV power sensor (kept while HPVC sensors are used)"
    max: 255
  hesc_own_grid_power_sensor:
    name: "HESC own grid power sensor (kept while HPVC sensors are used)"
    max: 255
  hesc_ev_connected_sensor:
    name: "HESC EV connected (binary sensor)"
    max: 255
  hesc_ev_power_sensor:
    name: "HESC EV charging power sensor"
    max: 255
  hesc_ev_green_energy_sensor:
    name: "HESC EV solar energy sensor (optional)"
    max: 255
  hesc_ev_soc_sensor:
    name: "HESC EV battery level sensor (optional)"
    max: 255
  hesc_charger_mode_entity:
    name: "HESC charger mode entity"
    max: 255
  hesc_charger_eco_value:
    name: "HESC charger solar mode value(s)"
    max: 128
  hesc_charger_solar_switch_entity:
    name: "HESC charger solar switch (optional)"
    max: 255
  hesc_ev_disconnected_values:
    name: "HESC EV not-connected states"
    max: 255
  hesc_hpvc_enabled_entity:
    name: "HESC HPVC enable switch"
    max: 255
  hesc_hpvc_limited_entity:
    name: "HESC HPVC limiting indicator"
    max: 255
  # --- status (written by Node-RED) ---
  hesc_state:
    name: "HESC state"
    max: 255
  hesc_reason:
    name: "HESC reason"
    max: 255
  hesc_last_action:
    name: "HESC last action"
    max: 255
  hesc_insight_1:
    name: "HESC insight 1"
    max: 255
  hesc_insight_2:
    name: "HESC insight 2"
    max: 255
  hesc_insight_3:
    name: "HESC insight 3"
    max: 255
  hesc_report_generated:
    name: "HESC report generated"
    max: 64
  hesc_advice:
    name: "HESC advice"
    max: 255
  hesc_advice_updated:
    name: "HESC advice updated"
    max: 64
  # v1.4.0: home battery <-> EV. Comma-separated sensors, one per home battery.
  # Power: positive = charging (as HBC shows it).
  hesc_home_battery_soc_sensors:
    name: "HESC home battery level sensors"
    max: 255
  hesc_home_battery_power_sensors:
    name: "HESC home battery power sensors"
    max: 255
  hesc_kick_status:
    name: "HESC home battery and EV status"
    max: 255

