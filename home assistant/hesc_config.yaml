    max: 10000
    step: 50
    unit_of_measurement: "W"
    icon: mdi:solar-power
    mode: box
  hesc_p_hold:
    name: "HESC forecast power to hold"
    min: 500
    max: 10000
    step: 50
    unit_of_measurement: "W"
    icon: mdi:solar-power-variant
    mode: box
  hesc_irr_start:
    name: "HESC irradiance to start"
    min: 0
    max: 1200
    step: 10
    unit_of_measurement: "W/m²"
    icon: mdi:white-balance-sunny
    mode: box
  hesc_irr_hold:
    name: "HESC irradiance to hold"
    min: 0
    max: 1200
