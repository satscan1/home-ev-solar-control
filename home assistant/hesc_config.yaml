    options: ["00:00", "00:30", "01:00", "01:30", "02:00", "02:30", "03:00", "03:30", "04:00", "04:30", "05:00", "05:30", "06:00", "06:30", "07:00", "07:30", "08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "21:00", "21:30", "22:00", "22:30", "23:00", "23:30"]
    icon: mdi:clock-outline
  hesc_plan_goal:
    name: "HESC charge plan goal"
    options: ["50%", "60%", "70%", "80%", "90%", "100%"]
    icon: mdi:battery-charging-high
  hesc_rep_time:
    name: "HESC repeating plan time"
    options: ["00:00", "00:30", "01:00", "01:30", "02:00", "02:30", "03:00", "03:30", "04:00", "04:30", "05:00", "05:30", "06:00", "06:30", "07:00", "07:30", "08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "21:00", "21:30", "22:00", "22:30", "23:00", "23:30"]
    icon: mdi:clock-outline
  hesc_rep_goal:
    name: "HESC repeating plan goal"
    options: ["50%", "60%", "70%", "80%", "90%", "100%"]
    icon: mdi:battery-charging-high
  hesc_charger_type:
    name: "HESC charger type"
    icon: mdi:ev-plug-type2
    options:
      - "Not chosen"
      - "Wallbox"
      - "Alfen Eve"
      - "Peblar"
      - "myenergi Zappi"
      - "go-e Charger"
      - "Fronius Wattpilot"
      - "SMA EV Charger"
      - "evcc (any charger)"
      - "Ohme"
      - "Easee"
      - "Other (manual)"

automation:
  # v1.4.0: fix the one-off deadline when day or time is chosen (or the plan is switched on).
  # "Tomorrow" chosen on Wednesday stays Thursday, also after midnight. After the deadline the one-off plan is finished.
  - id: hesc_plan_fix_deadline
    alias: "HESC - Fix one-off charge plan deadline"
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - input_select.hesc_plan_day
          - input_select.hesc_plan_time
      - trigger: state
        entity_id: input_boolean.hesc_plan_enabled
        to: "on"
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hesc_plan_deadline
        data:
          datetime: >-
            {%- set wds = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'] -%}
            {%- set day = states('input_select.hesc_plan_day') -%}
            {%- set base = today_at(states('input_select.hesc_plan_time')) -%}
            {%- if day == 'Today' -%}{%- set off = 0 -%}{%- elif day == 'Tomorrow' -%}{%- set off = 1 -%}{%- elif day in wds -%}{%- set off = (wds.index(day) - now().weekday()) % 7 -%}{%- if off == 0 and base <= now() -%}{%- set off = 7 -%}{%- endif -%}{%- else -%}{%- set off = 1 -%}{%- endif -%}
            {{ (base + timedelta(days=off)).strftime('%Y-%m-%d %H:%M:%S') }}
  # Charger type chosen: fill the brand values, and the charger entities when exactly one match was found.
  # Filled-in entity fields are never overwritten.
  - id: hesc_apply_charger_type
    alias: "HESC - Apply charger type"
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.hesc_charger_profile
        not_from: [unavailable, unknown]
      # v1.4.0: also after HA start, a template reload or "search again", so new empty fields (e.g. back-to-solar) get filled.
      # Filled-in fields are never overwritten; the brand values only change when the charger type itself changes.
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: state
        entity_id: input_button.hesc_charger_search
    actions:
      # give the charger profile a moment to be (re)calculated
      - delay: { seconds: 5 }
      - condition: template
        value_template: "{{ (state_attr('sensor.hesc_charger_profile', 'profile') or {}).get('known', false) }}"
      - variables:
          p: "{{ state_attr('sensor.hesc_charger_profile', 'profile') }}"
          brand_changed: >-
            {{ trigger.platform == 'state' and trigger.entity_id == 'sensor.hesc_charger_profile'
               and trigger.from_state is not none and trigger.from_state.state != trigger.to_state.state
               and trigger.from_state.state not in ['Not chosen', 'Other (manual)', 'unknown', 'unavailable'] }}
          empty: "{{ ['', 'unknown', 'unavailable'] }}"
      - if: "{{ brand_changed or (states('input_text.hesc_charger_eco_value') | trim) in empty }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hesc_charger_eco_value }
            data: { value: "{{ p['values'] }}" }
      - if: "{{ p.not_connected != '' and (brand_changed or (states('input_text.hesc_ev_disconnected_values') | trim) in empty) }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hesc_ev_disconnected_values }
            data: { value: "{{ p.not_connected }}" }
      - repeat:
          for_each:
            - { field: hesc_charger_mode_entity, key: mode }
            - { field: hesc_ev_connected_sensor, key: connected }
            - { field: hesc_ev_power_sensor, key: power }
            - { field: hesc_charger_solar_switch_entity, key: switch }
            - { field: hesc_charger_start_stop_entity, key: startstop }
            - { field: hesc_charger_resume_entity, key: resume }
          sequence:
            - if: "{{ (states('input_text.' ~ repeat.item.field) | trim) in empty and (p.get(repeat.item.key) or []) | count == 1 }}"
              then:
                - action: input_text.set_value
                  target: { entity_id: "input_text.{{ repeat.item.field }}" }
                  data: { value: "{{ p[repeat.item.key][0] }}" }

  # PV and grid power are taken over from HPVC, so a new user does not have to pick them twice.
  # Switch 'Use HPVC sensors' off in Settings to choose other sensors.
  - id: hesc_sync_sources_from_hpvc
    alias: "HESC - Take over PV and grid sensors from HPVC"
    mode: queued
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_text.hpvc_pv_power_sensor
          - input_text.hpvc_grid_power_sensor
      - trigger: state
        entity_id: input_boolean.hesc_use_hpvc_sources
        to: "on"
        id: switched_on
    conditions:
      - condition: state
        entity_id: input_boolean.hesc_use_hpvc_sources
        state: "on"
    actions:
      - variables:
          pv: "{{ states('input_text.hpvc_pv_power_sensor') | trim }}"
          grid: "{{ states('input_text.hpvc_grid_power_sensor') | trim }}"
          own_pv: "{{ states('input_text.hesc_pv_power_sensor') | trim }}"
          own_grid: "{{ states('input_text.hesc_grid_power_sensor') | trim }}"
      # remember the own choice first, so switching 'PV & grid from HPVC' off puts it back
      - if: "{{ trigger.id == 'switched_on' and own_pv not in ['', 'unknown', 'unavailable'] and own_pv != pv }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hesc_own_pv_power_sensor }
            data: { value: "{{ own_pv }}" }
      - if: "{{ trigger.id == 'switched_on' and own_grid not in ['', 'unknown', 'unavailable'] and own_grid != grid }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hesc_own_grid_power_sensor }
            data: { value: "{{ own_grid }}" }
      - if: "{{ pv not in ['', 'unknown', 'unavailable'] and pv != states('input_text.hesc_pv_power_sensor') }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hesc_pv_power_sensor }
            data: { value: "{{ pv }}" }
      - if: "{{ grid not in ['', 'unknown', 'unavailable'] and grid != states('input_text.hesc_grid_power_sensor') }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hesc_grid_power_sensor }
            data: { value: "{{ grid }}" }

  # Switching 'PV & grid from HPVC' off puts back the own PV and grid sensors that were kept when it was switched on.
  - id: hesc_restore_own_sources
    alias: "HESC - Put back own PV and grid sensors"
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_boolean.hesc_use_hpvc_sources
        from: "on"
        to: "off"
    actions:
      - variables:
          own_pv: "{{ states('input_text.hesc_own_pv_power_sensor') | trim }}"
          own_grid: "{{ states('input_text.hesc_own_grid_power_sensor') | trim }}"
      - if: "{{ own_pv not in ['', 'unknown', 'unavailable'] }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hesc_pv_power_sensor }
            data: { value: "{{ own_pv }}" }
      - if: "{{ own_grid not in ['', 'unknown', 'unavailable'] }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hesc_grid_power_sensor }
            data: { value: "{{ own_grid }}" }

  # Same pattern as HPVC: opening the report resets the tile to "Generate report".
  - id: hesc_reset_report_after_view
    alias: "HESC - Reset report after viewing"
    description: "Resets the report tile to Generate report when the generated HTML report is opened."
    mode: restart
    triggers:
      - trigger: webhook
        webhook_id: hesc_report_viewed
        allowed_methods: [POST]
        local_only: false
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hesc_report_ready

  # Same pattern as HPVC: sensible defaults only once, on first install.
  - id: hesc_apply_defaults_on_first_install
    alias: "HESC - Apply defaults on first install"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_boolean.hesc_defaults_applied
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.hesc_defaults_applied
        state: "off"
    actions:
      - delay: "00:00:10"
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.hesc_enabled
            - input_boolean.hesc_shadow_mode
            - input_boolean.hesc_use_hpvc_sources
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.hesc_owns_hpvc_off
            - input_boolean.hesc_use_irradiance
      - action: input_text.set_value
        target: { entity_id: input_text.hesc_forecast_now_sensor }
        data: { value: "sensor.solcast_pv_forecast_power_now" }
      - action: input_text.set_value
        target: { entity_id: input_text.hesc_forecast_30m_sensor }
        data: { value: "sensor.solcast_pv_forecast_power_in_30_minutes" }
      - action: input_text.set_value
        target: { entity_id: input_text.hesc_forecast_attribute }
        data: { value: "estimate10" }
      - action: input_text.set_value
        target: { entity_id: input_text.hesc_charger_eco_value }
        data: { value: "eco_mode" }
      - action: input_text.set_value
        target: { entity_id: input_text.hesc_hpvc_enabled_entity }
        data: { value: "input_boolean.hpvc_enabled" }
      - action: input_text.set_value
        target: { entity_id: input_text.hesc_hpvc_limited_entity }
        data: { value: "binary_sensor.hpvc_pv_limited" }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_p_start }
        data: { value: 2000 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_p_hold }
        data: { value: 1500 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_irr_start }
        data: { value: 220 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_irr_hold }
        data: { value: 160 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_t_stable }
        data: { value: 5 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_t_start }
        data: { value: 10 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_t_dip }
        data: { value: 5 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_t_stop }
        data: { value: 5 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_t_max }
        data: { value: 240 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_cooldown }
        data: { value: 30 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_max_attempts }
        data: { value: 3 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_ev_active_w }
        data: { value: 400 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_advice_window_days }
        data: { value: 30 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_advice_min_runs }
        data: { value: 8 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_ev_full_soc }
        data: { value: 80 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_plan_charge_kw }
        data: { value: 11 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_ev_battery_kwh }
        data: { value: 60 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_plan_opportunity_price }
        data: { value: 0.05 }
      # No HPVC found on a new install: start in standalone mode
      - if: "{{ states('input_boolean.hpvc_enabled') in ['unknown', 'unavailable'] and state_attr('input_boolean.hpvc_enabled', 'friendly_name') is none }}"
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.hesc_standalone }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.hesc_defaults_applied }

  # v1.2.0 settings get their starting values once: on a new install and when upgrading from v1.1.0 or older.
  # Only empty text fields are filled; nothing you already chose is overwritten.
  - id: hesc_apply_defaults_v120
    alias: "HESC - Apply v1.2.0 defaults (once)"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_boolean.hesc_defaults_v120_applied
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.hesc_defaults_v120_applied
        state: "off"
    actions:
      - delay: "00:00:15"
      - variables:
          empty: "{{ ['', 'unknown', 'unavailable'] }}"
      - if: "{{ (states('input_text.hesc_solar_today_sensor') | trim) in empty }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hesc_solar_today_sensor }
            data: { value: "sensor.solcast_pv_forecast_forecast_today" }
      - if: "{{ (states('input_text.hesc_solar_tomorrow_sensor') | trim) in empty }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.hesc_solar_tomorrow_sensor }
            data: { value: "sensor.solcast_pv_forecast_forecast_tomorrow" }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_plan_final_check_min }
        data: { value: 60 }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.hesc_defaults_v120_applied }

  # Minimum charge gets its starting values once (20% within 3 hours); it stays off until switched on.
  - id: hesc_apply_defaults_min_charge
    alias: "HESC - Apply minimum charge defaults (once)"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_boolean.hesc_defaults_min_charge_applied
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.hesc_defaults_min_charge_applied
        state: "off"
    actions:
      - delay: "00:00:15"
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_min_charge_soc }
        data: { value: 20 }
      - action: input_number.set_value
        target: { entity_id: input_number.hesc_min_charge_hours }
        data: { value: 3 }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.hesc_defaults_min_charge_applied }
