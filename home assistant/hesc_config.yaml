template:
  # Diagnostic mirrors of the selected sources (same idea as the hpvc_diag_* sensors).
  # They follow whatever entity is selected in Settings, convert kW to W, and give
  # the dashboard graphs one fixed set of entity ids for every installation.
  # The power sensors update once per minute to keep recorder writes low.
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
    sensor:
      - name: "HESC diag PV power"
        unique_id: hesc_diag_pv_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ states(states('input_text.hesc_pv_power_sensor')) | is_number }}"
        state: >
          {% set e = states('input_text.hesc_pv_power_sensor') %}
          {% set k = 1000 if (state_attr(e, 'unit_of_measurement') | string | lower) == 'kw' else 1 %}
          {{ (states(e) | float(0) * k) | round(0) }}
      - name: "HESC diag EV power"
        unique_id: hesc_diag_ev_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ states(states('input_text.hesc_ev_power_sensor')) | is_number }}"
        state: >
          {% set e = states('input_text.hesc_ev_power_sensor') %}
          {% set k = 1000 if (state_attr(e, 'unit_of_measurement') | string | lower) == 'kw' else 1 %}
          {{ (states(e) | float(0) * k) | round(0) }}
      - name: "HESC diag forecast power"
        unique_id: hesc_diag_forecast_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ states(states('input_text.hesc_forecast_now_sensor')) | is_number }}"
        state: "{{ states(states('input_text.hesc_forecast_now_sensor')) | float(0) | round(0) }}"
      - name: "HESC diag forecast cautious"
        unique_id: hesc_diag_forecast_cautious
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {% set e = states('input_text.hesc_forecast_now_sensor') %}
          {% set a = states('input_text.hesc_forecast_attribute') %}
          {{ (state_attr(e, a) if a not in ['', 'unknown', 'unavailable'] else states(e)) | is_number }}
        state: >
          {% set e = states('input_text.hesc_forecast_now_sensor') %}
          {% set a = states('input_text.hesc_forecast_attribute') %}
          {{ ((state_attr(e, a) if a not in ['', 'unknown', 'unavailable'] else states(e)) | float(0)) | round(0) }}
      - name: "HESC diag irradiance"
        unique_id: hesc_diag_irradiance
        unit_of_measurement: "W/m²"
        state_class: measurement
        availability: "{{ is_state('input_boolean.hesc_use_irradiance', 'on') and states(states('input_text.hesc_irradiance_sensor')) | is_number }}"
        state: "{{ states(states('input_text.hesc_irradiance_sensor')) | float(0) | round(0) }}"
  - binary_sensor:
      - name: "HESC diag EV connected"
        unique_id: hesc_diag_ev_connected
        icon: mdi:ev-plug-type2
        state: >
          {% set e = states('input_text.hesc_ev_connected_sensor') %}
          {% set s = states(e) | string %}
          {% set dv = states('input_text.hesc_ev_disconnected_values') %}
          {% set off = (dv if dv not in ['', 'unknown', 'unavailable'] else 'off,disconnected,ready,available,no_ev_connected,unplugged,not_connected,no car,idle,ev disconnected') | lower %}
          {% if e.split('.')[0] in ['binary_sensor', 'switch', 'input_boolean'] %}
            {{ s == 'on' }}
          {% else %}
            {{ s not in ['unknown', 'unavailable', ''] and (s | lower) not in (off.split(',') | map('trim') | list) }}
          {% endif %}
      - name: "HESC diag charger solar mode"
        unique_id: hesc_diag_charger_solar_mode
        icon: mdi:solar-power
        state: >
          {% set m = states(states('input_text.hesc_charger_mode_entity')) | string | lower %}
          {% set ev = states('input_text.hesc_charger_eco_value') %}
          {% set vals = ((ev if ev not in ['', 'unknown', 'unavailable'] else 'eco_mode') | lower).split(',') | map('trim') | list %}
          {% set sw = states('input_text.hesc_charger_solar_switch_entity') %}
          {{ m in vals and (sw in ['', 'unknown', 'unavailable'] or is_state(sw, 'on')) }}
      - name: "HESC diag release active"
        unique_id: hesc_diag_release_active
        icon: mdi:lock-open-variant-outline
        state: "{{ 'Release' in states('input_text.hesc_state') }}"

  # Setup check (same idea as binary_sensor.hpvc_configuration_valid).
  # On only when every essential source is filled in and exists. Only checks that
  # entities exist, not their current value, so a short outage does not hide the dashboard.
  - binary_sensor:
      - name: "HESC configuration valid"
        unique_id: hesc_configuration_valid
        icon: mdi:clipboard-check-outline
        state: >
          {% set ok = namespace(v=true) %}
          {% set fields = ['hesc_ev_connected_sensor', 'hesc_ev_power_sensor', 'hesc_charger_mode_entity', 'hesc_pv_power_sensor', 'hesc_forecast_now_sensor'] %}
          {% if not is_state('input_boolean.hesc_standalone', 'on') %}{% set fields = fields + ['hesc_hpvc_enabled_entity', 'hesc_hpvc_limited_entity'] %}{% endif %}
          {% for f in fields %}
            {% set e = states('input_text.' ~ f) | trim %}
            {% if e in ['', 'unknown', 'unavailable'] or (states(e) == 'unknown' and state_attr(e, 'friendly_name') is none) %}{% set ok.v = false %}{% endif %}
          {% endfor %}
          {{ ok.v and (states('input_text.hesc_charger_eco_value') | trim) not in ['', 'unknown', 'unavailable'] }}

  # Day-ahead prices available from the price sensor chosen in Settings (charge plan tab: graph or 'Prices not available').
  - binary_sensor:
      - name: "HESC prices available"
        unique_id: hesc_prices_available
        icon: mdi:currency-eur
        state: >
          {%- set e = states('input_text.hesc_price_sensor') | trim -%}
          {{ e not in ['', 'unknown', 'unavailable'] and states(e) not in ['unknown', 'unavailable']
             and (state_attr(e, 'raw_today') or []) | count > 0 }}

  # Charger profile: ONE table with the data per charger (edit only here), plus a search for
  # matching entities. Recomputed only when the charger type changes, on start and on 'Search again'.
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: state
        entity_id:
          - input_select.hesc_charger_type
          - input_button.hesc_charger_search
    sensor:
      - name: "HESC charger profile"
        unique_id: hesc_charger_profile
        icon: mdi:ev-plug-type2
        state: "{{ states('input_select.hesc_charger_type') }}"
        attributes:
          profile: >-
            {#- One table for all supported chargers. Add or correct a charger here only.
                mode: regex for the entity that holds the solar mode (searched in all entities).
                conn / power / switch: entity-id endings, searched on the same device as the mode entity.
                startstop (optional): pattern for the start/stop switch used by the charge plan (grid charging),
                searched on the same device; only filled in when exactly one match is found.
                Based on the integrations' source code; only Wallbox has been tested in practice. -#}
            {%- set T = {
              'Wallbox': {'values': 'eco_mode, full_solar', 'nc': 'Ready, Disconnected', 'mode': '^select\\..*_solar_charging$', 'conn': '_status_description$', 'power': '_charging_power$', 'switch': '', 'startstop': '^switch\\.', 'resume': '^button\\..*_resume_schedule$', 'tested': true, 'note': 'Official Wallbox integration. Tested with a Pulsar Plus.'},
              'Alfen Eve': {'values': 'Green', 'nc': 'Available', 'mode': '^select\\..*_solar_charging_mode$', 'conn': '_status_code_socket_1$', 'power': '_active_power_total_socket_1$', 'switch': '', 'tested': false, 'note': 'Needs a meter on the Alfen load balancing.'},
              'Peblar': {'values': 'pure_solar', 'nc': 'no_ev_connected', 'mode': '^select\\..*_smart_charging$', 'conn': '_state$', 'power': '_power$', 'switch': '', 'tested': false, 'note': ''},
              'myenergi Zappi': {'values': 'Eco+', 'nc': 'EV Disconnected', 'mode': '^select\\.myenergi_.*_charge_mode$', 'conn': '_plug_status$', 'power': '', 'switch': '', 'tested': false, 'note': 'Charging power: pick the Zappi internal-load CT power sensor yourself.'},
              'go-e Charger': {'values': '4', 'nc': '', 'mode': '^select\\.goe_.*_lmo$', 'conn': '_car_0$', 'power': '_nrg_11$', 'switch': '_fup$', 'tested': false, 'note': 'Needs grid/PV data (go-e Controller or pushed from Home Assistant).'},
              'Fronius Wattpilot': {'values': 'Eco', 'nc': 'no car', 'mode': '^select\\..*_charging_mode$', 'conn': '_car_connected$', 'power': '_charging_power$', 'switch': '_pv_surplus$', 'tested': false, 'note': 'Uses the Fronius meter.'},
              'SMA EV Charger': {'values': 'optimized_charging', 'nc': 'not_connected', 'mode': '^select\\..*_operating_mode_of_charge_session$', 'conn': '_charging_session_status$', 'power': '_charging_station_power$', 'switch': '', 'tested': false, 'note': 'Via Sunny Home Manager.'},
              'evcc (any charger)': {'values': 'pv', 'nc': '', 'mode': '^select\\.evcc_.*_mode$', 'conn': '_connected$', 'power': '_chargepower$', 'switch': '', 'tested': false, 'note': 'Read the evcc loadpoint, not the charger itself.'},
              'Ohme': {'values': 'on', 'nc': 'unplugged', 'mode': '^switch\\..*_solar_boost$', 'conn': '_status$', 'power': '_power$', 'switch': '', 'tested': false, 'note': 'Only partly: Home Pro with its own clamp.'},
              'Easee': {'values': 'on', 'nc': 'disconnected', 'mode': '', 'conn': '_status$', 'power': '_power$', 'switch': '', 'tested': false, 'note': 'Only with an Easee Equalizer; pick its surplus-charging switch as mode entity yourself.'}
            } -%}
            {%- set type = states('input_select.hesc_charger_type') -%}
            {%- set p = T.get(type) -%}
            {%- if p is none -%}
            {{ {'type': type, 'known': false} }}
            {%- else -%}
            {#- Search is language independent where possible: the mode entity is found by its options
                (they contain the solar value), the power sensor by device_class power on the same device. -#}
            {%- set vals = p['values'].split(',') | map('trim') | list -%}
            {%- set ns = namespace(m=[]) -%}
            {%- for s in states if s.attributes.options is defined and s.attributes.options is iterable and s.attributes.options is not string -%}
              {%- if vals | select('in', s.attributes.options | map('string') | list) | list | count > 0 -%}{%- set ns.m = ns.m + [s.entity_id] -%}{%- endif -%}
            {%- endfor -%}
            {%- if ns.m | count == 0 and p.mode -%}{%- set ns.m = states | map(attribute='entity_id') | select('match', p.mode) | list -%}{%- endif -%}
            {%- set modes = ns.m[:5] -%}
            {%- set dev = device_id(modes[0]) if modes | count == 1 else none -%}
            {%- set near = device_entities(dev) if dev else [] -%}
            {%- set power = near | select('match', '^sensor\\.') | select('is_state_attr', 'device_class', 'power') | list -%}
            {%- set conn = near | select('match', '^binary_sensor\\.') | select('is_state_attr', 'device_class', 'plug') | list -%}
            {%- if conn | count == 0 and p.conn -%}{%- set conn = near | select('search', p.conn) | list -%}{%- endif -%}
            {%- if conn | count == 0 -%}{%- set conn = near | select('match', '^sensor\\.') | select('search', '(status|state|plug|car|connect)') | reject('search', '(power|energy|current|voltage)') | reject('is_state_attr', 'state_class', 'measurement') | list -%}{%- endif -%}
            {%- set sw = near | select('search', p.switch) | list if p.switch else [] -%}
            {%- set ss = near | select('search', p.startstop) | list if p.get('startstop') else [] -%}
            {%- set rs = near | select('search', p.resume) | list if p.get('resume') else [] -%}
            {{ {'type': type, 'known': true, 'values': p['values'], 'not_connected': p.nc, 'tested': p.tested, 'note': p.note,
                'mode': modes, 'connected': conn[:5], 'power': power[:5], 'switch': sw[:5], 'startstop': ss[:5], 'resume': rs[:5]} }}
            {%- endif -%}
  # --- Charge plan: calculates the plan; the Node-RED "Charge plan" node acts on it ---
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - input_select.hesc_plan_day
          - input_select.hesc_plan_time
          - input_select.hesc_plan_goal
          - input_boolean.hesc_plan_enabled
          - input_datetime.hesc_plan_deadline
          - input_number.hesc_ev_battery_kwh
          - input_number.hesc_plan_charge_kw
          - input_boolean.hesc_rep_enabled
          - input_select.hesc_rep_time
          - input_select.hesc_rep_goal
          - input_boolean.hesc_rep_mon
          - input_boolean.hesc_rep_tue
          - input_boolean.hesc_rep_wed
          - input_boolean.hesc_rep_thu
          - input_boolean.hesc_rep_fri
          - input_boolean.hesc_rep_sat
          - input_boolean.hesc_rep_sun
    sensor:
      - name: "HESC charge plan"
        unique_id: hesc_charge_plan_preview
        device_class: timestamp
        icon: mdi:calendar-clock
        state: >
          {%- set wds = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'] -%}
          {%- set day = states('input_select.hesc_plan_day') -%}
          {%- set base = today_at(states('input_select.hesc_plan_time')) -%}
          {%- if day == 'Today' -%}{%- set off = 0 -%}{%- elif day == 'Tomorrow' -%}{%- set off = 1 -%}{%- elif day in wds -%}{%- set off = (wds.index(day) - now().weekday()) % 7 -%}{%- if off == 0 and base <= now() -%}{%- set off = 7 -%}{%- endif -%}{%- else -%}{%- set off = 1 -%}{%- endif -%}
          {%- set fx_ts = state_attr('input_datetime.hesc_plan_deadline', 'timestamp') | float(0) -%}{#- v1.4.0: one-off deadline fixed when day/time is chosen -#}{%- set one_dl = (fx_ts | as_datetime | as_local) if fx_ts > (as_timestamp(now()) - 400 * 86400) else base + timedelta(days=off) -%}
          {%- set rb = today_at(states('input_select.hesc_rep_time')) -%}
          {%- set rp = namespace(dl=none) -%}
          {%- for i in range(0, 8) -%}{%- set d = rb + timedelta(days=i) -%}{%- if rp.dl is none and d > now() and is_state('input_boolean.hesc_rep_' ~ (wds[d.weekday()] | lower), 'on') -%}{%- set rp.dl = d -%}{%- endif -%}{%- endfor -%}
          {%- set one_on = is_state('input_boolean.hesc_plan_enabled', 'on') and one_dl > now() -%}
          {%- set rep_on = is_state('input_boolean.hesc_rep_enabled', 'on') and rp.dl is not none -%}
          {%- if rep_on and (not one_on or rp.dl < one_dl) -%}{%- set dl = rp.dl -%}{%- set src = 'repeating' -%}{%- set goal_sel = states('input_select.hesc_rep_goal') -%}{%- else -%}{%- set dl = one_dl -%}{%- set src = 'one-off' -%}{%- set goal_sel = states('input_select.hesc_plan_goal') -%}{%- endif -%}
          {{ dl.isoformat() }}
        attributes:
          plan: >
            {%- set wds = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'] -%}
            {%- set day = states('input_select.hesc_plan_day') -%}
            {%- set base = today_at(states('input_select.hesc_plan_time')) -%}
            {%- if day == 'Today' -%}{%- set off = 0 -%}{%- elif day == 'Tomorrow' -%}{%- set off = 1 -%}{%- elif day in wds -%}{%- set off = (wds.index(day) - now().weekday()) % 7 -%}{%- if off == 0 and base <= now() -%}{%- set off = 7 -%}{%- endif -%}{%- else -%}{%- set off = 1 -%}{%- endif -%}
            {%- set fx_ts = state_attr('input_datetime.hesc_plan_deadline', 'timestamp') | float(0) -%}{#- v1.4.0: one-off deadline fixed when day/time is chosen -#}{%- set one_dl = (fx_ts | as_datetime | as_local) if fx_ts > (as_timestamp(now()) - 400 * 86400) else base + timedelta(days=off) -%}
            {%- set rb = today_at(states('input_select.hesc_rep_time')) -%}
            {%- set rp = namespace(dl=none) -%}
            {%- for i in range(0, 8) -%}{%- set d = rb + timedelta(days=i) -%}{%- if rp.dl is none and d > now() and is_state('input_boolean.hesc_rep_' ~ (wds[d.weekday()] | lower), 'on') -%}{%- set rp.dl = d -%}{%- endif -%}{%- endfor -%}
            {%- set one_on = is_state('input_boolean.hesc_plan_enabled', 'on') and one_dl > now() -%}
            {%- set rep_on = is_state('input_boolean.hesc_rep_enabled', 'on') and rp.dl is not none -%}
            {%- if rep_on and (not one_on or rp.dl < one_dl) -%}{%- set dl = rp.dl -%}{%- set src = 'repeating' -%}{%- set goal_sel = states('input_select.hesc_rep_goal') -%}{%- else -%}{%- set dl = one_dl -%}{%- set src = 'one-off' -%}{%- set goal_sel = states('input_select.hesc_plan_goal') -%}{%- endif -%}
            {%- set soc_e = states('input_text.hesc_ev_soc_sensor') | trim -%}
            {%- set soc = states(soc_e) | float(-1) if soc_e not in ['', 'unknown', 'unavailable'] else -1 -%}
            {%- set goal = goal_sel | replace('%', '') | float(80) -%}
            {%- set cap = states('input_number.hesc_ev_battery_kwh') | float(0) -%}
            {%- set kw = states('input_number.hesc_plan_charge_kw') | float(11) -%}
            {%- set need_kwh = ([goal - soc, 0] | max) / 100 * cap if (soc >= 0 and cap > 10) else 0 -%}
            {#- v1.2.0: expected solar charging before the deadline, per half hour (Solcast detailedForecast, cautious
                pv_estimate10 in kW). Same rule as the 'Expected solar charging' bar: >= start threshold starts,
                then >= hold threshold keeps charging. Per half hour (forecast - 0.4 kW house) x 0.5 h, max. the
                charging power. The rest comes from the grid in the cheapest quarters. -#}
            {%- set pstart = states('input_number.hesc_p_start') | float(2000) -%}
            {%- set phold = states('input_number.hesc_p_hold') | float(1500) -%}
            {%- set sol = namespace(kwh=0, phase='') -%}
            {%- for se in [states('input_text.hesc_solar_today_sensor') | trim, states('input_text.hesc_solar_tomorrow_sensor') | trim] -%}
            {%- for r in (state_attr(se, 'detailedForecast') or []) if se not in ['', 'unknown', 'unavailable'] -%}
            {%- set t = as_datetime(r.period_start) -%}{%- set e = t + timedelta(minutes=30) -%}
            {%- set v = (r.pv_estimate10 | float(0)) * 1000 -%}
            {%- if v >= pstart -%}{%- set sol.phase = 'go' -%}{%- elif v >= phold and sol.phase -%}{%- set sol.phase = 'hold' -%}{%- else -%}{%- set sol.phase = '' -%}{%- endif -%}
            {%- if sol.phase and e > now() and t < dl -%}
            {%- set s0 = t if t > now() else now() -%}{%- set e0 = e if e < dl else dl -%}
            {%- set frac = [(e0 - s0).total_seconds() / 1800, 0] | max -%}
            {%- set sol.kwh = sol.kwh + ([[v / 1000 - 0.4, 0] | max, kw] | min) * 0.5 * frac -%}
            {%- endif -%}
            {%- endfor -%}
            {%- endfor -%}
            {%- set solar_kwh = [sol.kwh, need_kwh] | min -%}
            {%- set grid_kwh = [need_kwh - solar_kwh, 0] | max -%}
            {%- set n = ((grid_kwh / (kw * 0.25)) | round(0, 'ceil')) | int if kw > 0 else 0 -%}
            {%- set a = state_attr(states('input_text.hesc_price_sensor'), 'raw_today') or [] -%}
            {%- set b = state_attr(states('input_text.hesc_price_sensor'), 'raw_tomorrow') or [] -%}
            {%- set pr = namespace(items=[], last=none) -%}
            {%- for p in a + b -%}{%- set pr.last = p.end -%}{%- if as_datetime(p.end) > now() and as_datetime(p.end) <= dl -%}{%- set pr.items = pr.items + [{'start': p.start, 'end': p.end, 'value': p.value, 'sort': p.value, 'fc': false}] -%}{%- endif -%}{%- endfor -%}
            {#- v1.3.0: after the last known price the planner may use the HESC price forecast (sensor.hesc_price_forecast);
                forecast quarters count as 'penalty' (2 ct) more expensive, so HESC only waits for them when clearly cheaper -#}
            {%- set fcs = state_attr('sensor.hesc_price_forecast', 'forecast') or [] -%}
            {%- set pen = state_attr('sensor.hesc_price_forecast', 'penalty') | float(0.02) -%}
            {%- set fcn = namespace(last=none) -%}
            {%- for p in fcs -%}{%- if (pr.last is none or as_datetime(p.start) >= as_datetime(pr.last)) and as_datetime(p.end) > now() and as_datetime(p.end) <= dl -%}{%- set pr.items = pr.items + [{'start': p.start, 'end': p.end, 'value': p.value, 'sort': p.value + pen, 'fc': true}] -%}{%- set fcn.last = p.end -%}{%- endif -%}{%- endfor -%}
            {%- set pick = (pr.items | sort(attribute='sort'))[:n] | sort(attribute='start') -%}
            {%- set pf = namespace(items=[]) -%}{%- for p in pick if p.fc -%}{%- set pf.items = pf.items + [as_datetime(p.start).isoformat()] -%}{%- endfor -%}
            {%- set pl = namespace(items=[]) -%}{%- for p in pick -%}{%- set pl.items = pl.items + [as_datetime(p.start).isoformat()] -%}{%- endfor -%}
            {%- set avg = ((pick | map(attribute='value') | sum) / (pick | count) * 100) | round(1) if pick | count > 0 else none -%}
            {%- set hrs = grid_kwh / kw if kw > 0 else 0 -%}
            {{ {'soc': soc | round(1) if soc >= 0 else none, 'goal': goal | int, 'need_kwh': need_kwh | round(1), 'solar_kwh': solar_kwh | round(1), 'grid_kwh': grid_kwh | round(1), 'quarters': n,
                'charge_time': '%d:%02d' | format((hrs | int), ((hrs * 60) | int) % 60), 'kw': kw, 'avg_price_ct': avg,
                'planned': pl.items, 'prices_complete': (pr.last is not none and as_datetime(pr.last) >= dl),
                'prices_until': as_datetime(pr.last).isoformat() if pr.last is not none else none, 'planned_forecast': pf.items, 'forecast_until': as_datetime(fcn.last).isoformat() if fcn.last is not none else none, 'deadline': dl.isoformat(), 'source': src, 'active': one_on or rep_on, 'deadline_text': dl.strftime('%a %d-%m %H:%M') } | tojson }}
  # v1.4.0: configuration checks per settings block (on = OK). The Settings page closes a block when its
  # check is OK and opens it by itself when something is wrong. Attribute "missing" says what is wrong.
  - binary_sensor:
      - name: "HESC check charger"
        unique_id: hesc_check_charger
        icon: mdi:ev-station
        state: >-
          {%- macro bad(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none or states(e) == 'unavailable' }}{%- endmacro -%}{%- macro gone(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none }}{%- endmacro -%}
          {%- set ns = namespace(m=[]) -%}
          {%- for t, label in [('input_text.hesc_ev_connected_sensor', 'EV connected sensor'), ('input_text.hesc_ev_power_sensor', 'charging power sensor'), ('input_text.hesc_charger_mode_entity', 'charger mode entity')] -%}
          {%- if bad(states(t) | trim) == 'True' -%}{%- set ns.m = ns.m + [label] -%}{%- endif -%}
          {%- endfor -%}
          {%- if (states('input_text.hesc_charger_eco_value') | trim) in ['', 'unknown', 'unavailable'] -%}{%- set ns.m = ns.m + ['solar mode value'] -%}{%- endif -%}
          {{ ns.m | count == 0 }}
        attributes:
          missing: >-
            {%- macro bad(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none or states(e) == 'unavailable' }}{%- endmacro -%}{%- macro gone(e) -%}{{ e in ['', 'unknown', 'unavailable'] or state_attr(e, 'friendly_name') is none }}{%- endmacro -%}
            {%- set ns = namespace(m=[]) -%}
            {%- for t, label in [('input_text.hesc_ev_connected_sensor', 'EV connected sensor'), ('input_text.hesc_ev_power_sensor', 'charging power sensor'), ('input_text.hesc_charger_mode_entity', 'charger mode entity')] -%}
            {%- if bad(states(t) | trim) == 'True' -%}{%- set ns.m = ns.m + [label] -%}{%- endif -%}
            {%- endfor -%}
            {%- if (states('input_text.hesc_charger_eco_value') | trim) in ['', 'unknown', 'unavailable'] -%}{%- set ns.m = ns.m + ['solar mode value'] -%}{%- endif -%}
            {{ ns.m | join(', ') }}
      - name: "HESC check sources"
