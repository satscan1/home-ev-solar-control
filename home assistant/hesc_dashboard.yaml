    badges: []
  - type: sections
    title: Settings
    path: settings
    icon: mdi:cog
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |-
              ### 🔌 1 · Your charger — required <a href="/home-ev-solar-control/guide" title="Guide: how smart charging works"><ha-icon icon="mdi:information-outline" style="--mdc-icon-size:20px;color:#8ab4f8;vertical-align:-2px"></ha-icon></a>
              This is all HESC needs from you. Choose your charger type first: HESC fills in the brand values and suggests the entities it finds. When the check below is green the fields stay closed; open them with **Charger fields**. Something wrong? They open by themselves.
            grid_options:
              columns: 12
              rows: auto
          - type: vertical-stack
            grid_options:
              columns: 12
            cards:
              - type: horizontal-stack
                cards:
                  - type: tile
                    entity: input_select.hesc_charger_type
                    name: Charger type
                    icon: mdi:ev-plug-type2
                    hide_state: true
                    vertical: false
                    features_position: bottom
                    features:
                      - type: select-options
                  - type: tile
                    entity: input_button.hesc_charger_search
                    name: Search again
                    icon: mdi:magnify
                    hide_state: true
                    vertical: true
                    tap_action:
                      action: perform-action
                      perform_action: input_button.press
                      target:
                        entity_id: input_button.hesc_charger_search
                    icon_tap_action:
                      action: perform-action
                      perform_action: input_button.press
                      target:
                        entity_id: input_button.hesc_charger_search
                card_mod:
                  style: '#root > *:first-child { flex: 3 1 0 !important; } #root > *:last-child { flex: 1 1 0 !important; }'
              - type: tile
                entity: input_boolean.hesc_show_charger_fields
                name: Charger fields
                icon: mdi:form-textbox
                hide_state: true
                vertical: false
                features_position: inline
                features:
                  - type: toggle
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - entity: input_boolean.hesc_show_charger_fields
                    state: 'on'
                  - entity: binary_sensor.hesc_check_charger
                    state: 'off'
            card:
              type: entities
              entities:
                - entity: input_text.hesc_ev_connected_sensor
                  name: EV connected (binary or status sensor)
                - entity: input_text.hesc_ev_power_sensor
                  name: Charging power (W or kW)
                - entity: input_text.hesc_charger_mode_entity
                  name: Charger mode entity
                - entity: input_text.hesc_charger_eco_value
                  name: Value(s) that mean solar charging, comma separated
          - type: markdown
            grid_options:
              columns: 12
              rows: auto
            content: |
              {%- set ok = '✅' -%}{%- set no = '❌' -%}{%- set off = '⚪' -%}{%- set warn = '⚠️' -%}
              {%- macro exists(e) -%}{{ e not in ['', 'unknown', 'unavailable'] and state_attr(e, 'friendly_name') is not none }}{%- endmacro -%}
              {%- macro now(e) -%}{%- set u = state_attr(e, 'unit_of_measurement') -%}{{ states(e) }}{{ ' ' ~ u if u else '' }}{%- endmacro -%}
              {%- macro val(e) -%}{%- set u = state_attr(e, 'unit_of_measurement') or '' -%}{%- set x = states(e) | float(none) -%}{{ ('%g' | format(x | round(1 if u | lower in ['kw', 'kwh'] else 0))) if x is not none else states(e) }}{{ ' ' ~ u if u else '' }}{%- endmacro -%}
              {%- macro code(e) -%}<code>{{ e if e not in ['', 'unknown'] else '–' }}</code>{%- endmacro -%}
              {%- set pr = state_attr('sensor.hesc_charger_profile', 'profile') or {} -%}
              {%- macro sug(key, good) -%}{%- if not good and (pr.get(key) or []) | count > 0 -%}<br>&nbsp;&nbsp;💡 Suggested: {{ pr.get(key) | map('string') | map('regex_replace', '^(.*)$', '<code>\\1</code>') | join(' or ') }}{%- endif -%}{%- endmacro -%}
              {%- set C = {'charger': 'binary_sensor.hesc_check_charger', 'sources': 'binary_sensor.hesc_check_sources', 'weather': 'binary_sensor.hesc_check_weather_station', 'plan': 'binary_sensor.hesc_check_charge_plan', 'kick': 'binary_sensor.hesc_check_home_battery_and_ev'} -%}
              {%- set wx = is_state('input_boolean.hesc_use_irradiance', 'on') -%}
              {%- set kick = is_state('input_boolean.hesc_kick_enabled', 'on') -%}
              {%- set minc = is_state('input_boolean.hesc_min_charge_enabled', 'on') -%}
              {%- set used = ['charger', 'sources', 'plan'] + (['weather'] if wx else []) + (['kick'] if kick else []) -%}
              {%- set n2 = namespace(g=0) -%}{%- for k in used -%}{%- if is_state(C[k], 'on') -%}{%- set n2.g = n2.g + 1 -%}{%- endif -%}{%- endfor -%}
              {%- set good = n2.g -%}{%- set total = used | count -%}
              {%- set unused = ([] if wx else ['weather station']) + ([] if minc else ['minimum charge']) + ([] if kick else ['home battery and EV']) -%}
              {%- set conn = states('input_text.hesc_ev_connected_sensor') | trim -%}
              {%- set pow = states('input_text.hesc_ev_power_sensor') | trim -%}
              {%- set mode = states('input_text.hesc_charger_mode_entity') | trim -%}
              {%- set solar = (states('input_text.hesc_charger_eco_value') | trim).split(',') | map('trim') | list -%}
              {%- set pv = states('input_text.hesc_pv_power_sensor') | trim -%}
              {%- set grid = states('input_text.hesc_grid_power_sensor') | trim -%}
              {%- set fc = states('input_text.hesc_forecast_now_sensor') | trim -%}{%- set fa = states('input_text.hesc_forecast_attribute') | trim -%}
              {%- set fcw = (state_attr(fc, fa) if fa not in ['', 'unknown'] else states(fc)) | int(0) -%}
              {%- set sa = is_state('input_boolean.hesc_standalone', 'on') -%}
              {%- set hpvc_ok = exists(states('input_text.hesc_hpvc_enabled_entity') | trim) == 'True' -%}
              {%- set ss = states('input_text.hesc_charger_start_stop_entity') | trim -%}
              {%- set rs = states('input_text.hesc_charger_resume_entity') | trim -%}
              {%- set price = states('input_text.hesc_price_sensor') | trim -%}
              {%- set today = states('input_text.hesc_solar_today_sensor') | trim -%}
              {%- set tomorrow = (state_attr('sensor.hesc_prices', 'raw_tomorrow') or []) | count > 0 -%}
              ### {{ ok ~ ' Setup verified · all OK' if good == total else warn ~ ' Setup · ' ~ (total - good) ~ (' item needs' if total - good == 1 else ' items need') ~ ' attention' }}
              {%- if is_state(C.charger, 'on') %}
              {{ ok }} **Charger** {{ pr.type if pr.get('known') else (pr.get('type') or 'type not chosen') }} · EV {{ states(conn) }} · {{ val(pow) }} · {{ 'solar mode' if states(mode) in solar else warn ~ ' not in solar mode (' ~ states(mode) ~ ')' }}
              {%- else %}
              {{ no }} **Charger** — missing: {{ state_attr(C.charger, 'missing') }}. The fields above have opened.
              &nbsp;&nbsp;{{ ok if exists(conn) == 'True' else no }} EV connected: {{ code(conn) }} · now {{ states(conn) }}{{ sug('connected', exists(conn) == 'True') }}
              &nbsp;&nbsp;{{ ok if exists(pow) == 'True' else no }} Charging power: {{ code(pow) }} · now {{ now(pow) }}{{ sug('power', exists(pow) == 'True') }}
              &nbsp;&nbsp;{{ ok if exists(mode) == 'True' else no }} Solar mode: {{ code(mode) }} · now {{ states(mode) }}{{ sug('mode', exists(mode) == 'True') }}
              {%- endif %}
              {%- if is_state(C.sources, 'on') %}
              {{ ok }} **Sources** PV {{ val(pv) }}{{ ' · grid ' ~ val(grid) if exists(grid) == 'True' else '' }} · forecast {{ fcw }} W · {{ 'no HPVC (standalone)' if sa else 'HPVC found' }}
              {%- else %}
              {{ no }} **Sources** — missing: {{ state_attr(C.sources, 'missing') }}. Open “Change sources” in column 2.
              &nbsp;&nbsp;{{ ok if exists(pv) == 'True' else no }} PV power: {{ code(pv) }} · now {{ now(pv) }}
              &nbsp;&nbsp;{{ (ok if exists(grid) == 'True' else no) if grid not in ['', 'unknown'] else off }} Grid power: {{ code(grid) }}{{ ' · now ' ~ now(grid) if exists(grid) == 'True' else ' · optional' }}
              &nbsp;&nbsp;{{ ok if exists(fc) == 'True' else no }} Solar forecast: {{ code(fc) }}{{ ' (' ~ fa ~ ')' if fa not in ['', 'unknown'] else '' }} · now {{ fcw }} W
              {%- if not sa %}
              &nbsp;&nbsp;{{ ok if hpvc_ok else no }} HPVC: {{ 'found' if hpvc_ok else 'not found — is Home PV Control installed?' }}
              {%- endif %}
              {%- endif %}
              {%- if wx %}
              {%- if is_state(C.weather, 'on') %}
              {{ ok }} **Weather station** {{ val(states('input_text.hesc_irradiance_sensor') | trim) }}
              {%- else %}
              {{ no }} **Weather station** — missing: {{ state_attr(C.weather, 'missing') }}. Its settings in column 2 have opened.
              {%- endif %}
              {%- endif %}
              {%- if is_state(C.plan, 'on') %}
              {{ ok }} **Charge plan** price now {{ (states('sensor.hesc_prices') | float(0) * 100) | round(1) }} {{ (state_attr('sensor.hesc_prices', 'minor') or 'ct') }} · tomorrow {{ 'known' if tomorrow else 'not yet' }} · sun today {{ states(today) | float(0) | round(0) | int }} kWh{{ (' · minimum ' ~ states('input_number.hesc_min_charge_soc') | int ~ '% within ' ~ states('input_number.hesc_min_charge_hours') | int ~ ' h') if minc else '' }}
              {%- else %}
              {{ no }} **Charge plan** — missing: {{ state_attr(C.plan, 'missing') }}. The Charge plan settings in column 3 have opened.
              &nbsp;&nbsp;{{ ok if exists(ss) == 'True' else off }} Start/stop switch: {{ code(ss) }} · now {{ states(ss) }}
              &nbsp;&nbsp;{{ ok if exists(rs) == 'True' else off }} Back to solar mode: {{ code(rs) }}
              &nbsp;&nbsp;{{ ok if exists(price) == 'True' and state_attr(price, 'raw_today') is not none else no }} Price sensor: {{ code(price) }}
              &nbsp;&nbsp;{{ ok if exists(today) == 'True' else no }} Solar forecast today: {{ code(today) }}
              {%- endif %}
              {%- if kick %}
              {%- if is_state(C.kick, 'on') %}
              {%- set lv = (states('input_text.hesc_home_battery_soc_sensors') | trim).split(',') | map('trim') | map('states') | map('float', none) | reject('none') | list -%}
              {%- set pw = (states('input_text.hesc_home_battery_power_sensors') | trim).split(',') | map('trim') | map('states') | map('float', none) | reject('none') | list %}
              {{ ok }} **Home battery and EV** home batteries {{ (lv | sum / lv | count) | round(0) | int if lv | count else '–' }}% · {{ 'charging ' if pw | sum > 50 else 'discharging ' if pw | sum < -50 else 'idle' }}{{ ((pw | sum) | abs | int ~ ' W') if (pw | count and (pw | sum) | abs > 50) else '' }}{{ (' · EV ' ~ (states('sensor.hesc_ev_soc') | float | round(0) | int) ~ '%') if states('sensor.hesc_ev_soc') | is_number else '' }}
              {%- else %}
              {{ no }} **Home battery and EV** — missing: {{ state_attr(C.kick, 'missing') }}. Its settings in column 3 have opened.
              {%- endif %}
              {%- endif %}
              {%- if unused | count %}
              {{ off }} Not used: {{ unused | join(', ') }}
              {%- endif %}
              **Now:** {{ states('input_text.hesc_state') }} · {{ states('input_text.hesc_plan_status') }}{{ ' · ' ~ states('input_text.hesc_kick_status') if kick and states('input_text.hesc_kick_status') not in [states('input_text.hesc_plan_status'), 'Off', 'Waiting'] else '' }}
          - type: vertical-stack
            grid_options:
              columns: 12
            cards:
              - type: tile
                entity: input_boolean.hesc_advice_auto
                name: Apply advice automatically
                icon: mdi:auto-fix
                hide_state: true
                vertical: false
                features_position: inline
                features:
                  - type: toggle
                card_mod:
                  style: 'ha-card { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }'
              - type: markdown
                content: |-
                  {%- set a = 'sensor.hesc_advice_threshold' -%}
                  {%- set s = states(a) -%}
                  {%- set f = '{:,.0f}' -%}
                  {%- set upd = (as_timestamp(state_attr(a, 'updated')) | timestamp_custom('%a %H:%M')) if state_attr(a, 'updated') else '–' -%}
                  {%- if s in ['unknown', 'unavailable'] -%}
                  <font color="#94a3b8">Working it out…</font>
                  {%- else -%}
                  {%- set l1 = '**Now** ' ~ f.format(states('input_number.hesc_p_start') | float(0)) ~ ' / ' ~ f.format(states('input_number.hesc_p_hold') | float(0)) ~ ' W' ~ ((' · **Advice** ' ~ f.format(state_attr(a, 'advised_start')) ~ ' / ' ~ f.format(state_attr(a, 'advised_hold')) ~ ' W') if state_attr(a, 'advised_start') else '') -%}
                  {%- set l2 = '**Based on** ' ~ (state_attr(a, 'sun_sessions') if state_attr(a, 'method') == 'sun_share' else state_attr(a, 'good_sessions')) ~ ' sessions (' ~ state_attr(a, 'days') ~ ' days)' ~ ((' · need ' ~ state_attr(a, 'need_sessions') ~ ' on ' ~ state_attr(a, 'need_days') ~ ' days') if s == 'collecting' else '') -%}
                  {%- set l3 = ('**Sun share** ' ~ state_attr(a, 'sun_share_above') ~ '% from the advice up · ' ~ state_attr(a, 'sun_share_below') ~ '% below (goal ' ~ state_attr(a, 'sun_target') ~ '%)') if state_attr(a, 'method') == 'sun_share' and state_attr(a, 'sun_share_below') is not none else (('**Forecast** at start ' ~ f.format(state_attr(a, 'lowest_good_forecast')) ~ ' – ' ~ f.format(state_attr(a, 'median_good_forecast')) ~ ' W') if state_attr(a, 'lowest_good_forecast') else '') -%}
                  {%- set l4 = '**Auto** ' ~ ('on' if is_state('input_boolean.hesc_advice_auto', 'on') else 'off') ~ ' (checked ' ~ upd ~ ')' ~ ((' · last ' ~ state_attr(a, 'last_change')) if state_attr(a, 'last_change') else '') ~ ((' · next step from ' ~ (as_timestamp(state_attr(a, 'next_step_from')) | timestamp_custom('%a %d %b'))) if state_attr(a, 'next_step_from') else '') ~ (' · seasonal on' if is_state('input_boolean.hesc_seasonal_threshold', 'on') else '') -%}
                  {{ [l1, l2, l3, l4] | reject('eq', '') | join('<br>') }}
                  {%- endif -%}
                card_mod:
                  style: 'ha-card { border-top-left-radius: 0; border-top-right-radius: 0; } ha-markdown { padding: 8px 16px 12px !important; line-height: 1.45; }'
          - type: markdown
            grid_options:
              columns: 12
            content: |-
              {%- macro n(e) -%}{{ '%g' | format(states(e) | float(0)) }}{%- endmacro -%}
              {%- set wx = is_state('input_boolean.hesc_use_irradiance', 'on') -%}
              {%- set kick = is_state('input_boolean.hesc_kick_enabled', 'on') -%}
              {%- set minc = is_state('input_boolean.hesc_min_charge_enabled', 'on') -%}
              ### ⚙️ Your settings
              **Start / hold** forecast {{ n('input_number.hesc_p_start') }} / {{ n('input_number.hesc_p_hold') }} W{{ (' · weather station ' ~ n('input_number.hesc_irr_start') ~ ' / ' ~ n('input_number.hesc_irr_hold') ~ ' W/m²') if wx else '' }}
              **EV** full at {{ n('input_number.hesc_ev_full_soc') }}% · battery {{ n('input_number.hesc_ev_battery_kwh') }} kWh · grid charging {{ n('input_number.hesc_plan_charge_kw') }} kW · charging above {{ n('input_number.hesc_ev_active_w') }} W
              **Timing** stable {{ n('input_number.hesc_t_stable') }} · wait for charger {{ n('input_number.hesc_t_start') }} · dip {{ n('input_number.hesc_t_dip') }} · stop {{ n('input_number.hesc_t_stop') }} · max {{ n('input_number.hesc_t_max') }} · cooldown {{ n('input_number.hesc_cooldown') }} min · max {{ n('input_number.hesc_max_attempts') }} failed releases a day
              **Charge plan** {{ ('cheap below ' ~ (states('input_number.hesc_plan_opportunity_price') | float(0) * 100) | round(1) ~ ' ' ~ (state_attr('sensor.hesc_prices', 'minor') or 'ct')) if is_state('input_boolean.hesc_plan_opportunity', 'on') else 'cheap chances off' }} · final check {{ n('input_number.hesc_plan_final_check_min') }} min{{ (' · minimum ' ~ n('input_number.hesc_min_charge_soc') ~ '% within ' ~ n('input_number.hesc_min_charge_hours') ~ ' h') if minc else '' }}
              **Advice** last {{ n('input_number.hesc_advice_window_days') }} days · at least {{ n('input_number.hesc_advice_min_runs') }} sessions
              <small>Change a value in the block on the right (column 3 · Advanced).</small>
            card_mod:
              style: 'ha-card { height: 100%; }'
          - type: vertical-stack
            grid_options:
              columns: 12
            cards:
              - type: horizontal-stack
                cards:
                  - type: tile
                    entity: input_button.hesc_settings_backup
                    name: Back up settings
                    icon: mdi:content-save-cog-outline
                    color: blue
                    hide_state: true
                    vertical: true
                    tap_action:
                      action: perform-action
                      perform_action: input_button.press
                      target:
                        entity_id: input_button.hesc_settings_backup
                    icon_tap_action:
                      action: perform-action
                      perform_action: input_button.press
                      target:
                        entity_id: input_button.hesc_settings_backup
                  - type: tile
                    entity: input_button.hesc_settings_restore
                    name: Restore back-up
                    icon: mdi:backup-restore
                    color: amber
                    hide_state: true
                    vertical: true
                    tap_action:
                      action: perform-action
                      perform_action: input_button.press
                      target:
                        entity_id: input_button.hesc_settings_restore
                      confirmation:
                        text: Put all HESC settings back to the last back-up?
                    icon_tap_action:
                      action: perform-action
                      perform_action: input_button.press
                      target:
                        entity_id: input_button.hesc_settings_restore
                      confirmation:
                        text: Put all HESC settings back to the last back-up?
                  - type: tile
                    entity: input_button.hesc_settings_reset
                    name: Standard values
                    icon: mdi:restore
                    color: red
                    hide_state: true
                    vertical: true
                    tap_action:
                      action: perform-action
                      perform_action: input_button.press
                      target:
                        entity_id: input_button.hesc_settings_reset
                      confirmation:
                        text: Put thresholds, timing and advice back to the HESC standard values? A back-up is made first, so you can undo this with "Restore back-up".
                    icon_tap_action:
                      action: perform-action
                      perform_action: input_button.press
                      target:
                        entity_id: input_button.hesc_settings_reset
                      confirmation:
                        text: Put thresholds, timing and advice back to the HESC standard values? A back-up is made first, so you can undo this with "Restore back-up".
              - type: markdown
                content: <small>💾 {{ states('input_text.hesc_settings_backup_info') if states('input_text.hesc_settings_backup_info') not in ['unknown', ''] else 'No back-up yet' }}</small>
                text_only: true
              - type: markdown
                content: |-
                  ### 💶 Charging costs
                  Optional. Adds a <b>Costs</b> button at the top of Main that opens an overview of what went into the EV.
              - type: horizontal-stack
                cards:
                  - type: tile
                    entity: input_boolean.hesc_costs_enabled
                    name: Use
                    icon: mdi:cash-multiple
                    hide_state: true
                    vertical: false
                    features_position: inline
                    features:
                      - type: toggle
                  - type: tile
                    entity: input_boolean.hesc_show_costs_settings
                    name: Settings
                    icon: mdi:tune-vertical
                    hide_state: true
                    vertical: false
                    features_position: inline
                    features:
                      - type: toggle
              - type: conditional
                conditions:
                  - entity: input_boolean.hesc_show_costs_settings
                    state: 'on'
                card:
                  type: entities
                  entities:
                    - entity: input_number.hesc_feed_in_price
                      name: Value of a solar kWh (feed-in compensation, 0 = free)
                    - entity: input_boolean.hesc_costs_all_in
                      name: Price from the price source is already all-in
                    - type: conditional
                      conditions:
                        - entity: input_boolean.hesc_costs_all_in
                          state: 'off'
                      row:
                        entity: input_number.hesc_costs_markup
                        name: Mark-up per kWh (energy tax + supplier)
                    - type: conditional
                      conditions:
                        - entity: input_boolean.hesc_costs_all_in
                          state: 'off'
                      row:
                        entity: input_number.hesc_costs_vat
                        name: VAT over price + mark-up
        column_span: 2
      - type: grid
        cards:
          - type: markdown
            content: |-
              {% if is_state('input_boolean.hesc_standalone', 'on') %}### 🔗 2 · Sources <a href="/home-ev-solar-control/guide" title="Guide: how smart charging works"><ha-icon icon="mdi:information-outline" style="--mdc-icon-size:20px;color:#8ab4f8;vertical-align:-2px"></ha-icon></a>
              Running **without HPVC**. Pick your own PV and grid power sensors below. The solar forecast (Solcast, cautious estimate) is filled in on install. Without HPVC nothing is curtailed, so there is no release step: the charger starts on solar by itself, HESC follows it and gives advice.{% else %}### 🔗 2 · Sources <a href="/home-ev-solar-control/guide" title="Guide: how smart charging works"><ha-icon icon="mdi:information-outline" style="--mdc-icon-size:20px;color:#8ab4f8;vertical-align:-2px"></ha-icon></a>
              **PV & grid from HPVC** takes over the PV and grid sensors from Home PV Control. Only use it if HPVC sees **all** your solar panels: HESC needs your total solar power. Switching it off puts your own sensors back. The solar forecast (Solcast, cautious estimate) and the HPVC switch are filled in on install.{% endif %}
            grid_options:
              columns: 12
          - type: tile
            entity: input_boolean.hesc_standalone
            name: No HPVC (standalone)
            icon: mdi:link-variant-off
            hide_state: true
            vertical: false
            features_position: inline
            features:
              - type: toggle
            grid_options:
              columns: 12
          - type: conditional
            conditions:
              - entity: input_boolean.hesc_standalone
                state: 'off'
            card:
              type: tile
              entity: input_boolean.hesc_use_hpvc_sources
              name: PV & grid from HPVC
              icon: mdi:link-variant
              hide_state: true
              vertical: false
              features_position: inline
              features:
                - type: toggle
              grid_options:
                columns: 12
            grid_options:
              columns: 12
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - entity: input_boolean.hesc_use_hpvc_sources
                    state: 'off'
                  - entity: input_boolean.hesc_standalone
                    state: 'on'
              - condition: or
                conditions:
                  - entity: input_boolean.hesc_edit_sources
                    state: 'on'
                  - entity: binary_sensor.hesc_check_sources
                    state: 'off'
            card:
              type: entities
              entities:
                - entity: input_text.hesc_pv_power_sensor
                  name: Actual PV power
                - entity: input_text.hesc_grid_power_sensor
                  name: Grid power (negative = export)
                - entity: input_boolean.hesc_grid_export_positive
                  name: 'Grid sensor: export is positive (off = import positive, most meters)'
          - type: tile
            entity: input_boolean.hesc_edit_sources
            name: Change sources
            icon: mdi:pencil-outline
            hide_state: true
            vertical: false
            features_position: inline
            features:
              - type: toggle
            grid_options:
              columns: 12
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - entity: input_boolean.hesc_edit_sources
                    state: 'on'
                  - entity: binary_sensor.hesc_check_sources
                    state: 'off'
            card:
              type: entities
              entities:
                - entity: input_text.hesc_forecast_now_sensor
                  name: Forecast power now
                - entity: input_text.hesc_forecast_30m_sensor
                  name: Forecast power +30 min
                - entity: input_text.hesc_forecast_attribute
                  name: Forecast attribute (empty = state)
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - entity: input_boolean.hesc_edit_sources
                    state: 'on'
                  - entity: binary_sensor.hesc_check_sources
                    state: 'off'
              - entity: input_boolean.hesc_standalone
                state: 'off'
            card:
              type: entities
              title: HPVC
              entities:
                - entity: input_text.hesc_hpvc_enabled_entity
                  name: HPVC enable switch
                - entity: input_text.hesc_hpvc_limited_entity
                  name: HPVC limiting indicator
          - type: markdown
            content: |-
              ### 🧩 Optional
              Only needed for some chargers, or for extra detail in the report.
            grid_options:
              columns: 12
          - type: tile
            entity: input_boolean.hesc_show_optional
            name: Show optional fields
            icon: mdi:tune-variant
            hide_state: true
            vertical: false
            features_position: inline
            features:
              - type: toggle
            grid_options:
              columns: 12
          - type: conditional
            conditions:
              - entity: input_boolean.hesc_show_optional
                state: 'on'
            card:
              type: entities
              entities:
                - entity: input_text.hesc_ev_disconnected_values
                  name: Status values meaning "no car" (only for a status sensor)
                - entity: input_text.hesc_charger_solar_switch_entity
                  name: Extra solar switch
                - entity: input_text.hesc_ev_green_energy_sensor
                  name: Solar energy counter (kWh from solar in the report)
                - entity: input_text.hesc_ev_soc_sensor
                  name: EV battery level (explains stops, e.g. EV full)
                - entity: input_number.hesc_ev_full_soc
                  name: EV counts as full at
          - type: markdown
            content: |-
              ### 🌤️ Local weather station
              Optional. When off, HESC works on the forecast alone.
            grid_options:
              columns: 12
          - type: horizontal-stack
            cards:
              - type: tile
                entity: input_boolean.hesc_use_irradiance
                name: Use
                icon: mdi:weather-sunny
                hide_state: true
                vertical: false
                features_position: inline
                features:
                  - type: toggle
              - type: tile
                entity: input_boolean.hesc_show_weather_settings
                name: Settings
                icon: mdi:tune-vertical
                hide_state: true
                vertical: false
                features_position: inline
                features:
                  - type: toggle
            grid_options:
              columns: 12
          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - entity: input_boolean.hesc_show_weather_settings
                    state: 'on'
                  - condition: and
                    conditions:
                      - entity: input_boolean.hesc_use_irradiance
                        state: 'on'
                      - entity: binary_sensor.hesc_check_weather_station
                        state: 'off'
            card:
              type: entities
              entities:
                - entity: input_text.hesc_irradiance_sensor
                  name: Irradiance sensor (W/m²)
                - entity: input_number.hesc_irr_start
                  name: Irradiance to start
                - entity: input_number.hesc_irr_hold
                  name: Irradiance to hold
      - type: grid
        cards:
          - type: markdown
            content: |-
              ### 🎚️ 3 · Advanced — only if needed <a href="/home-ev-solar-control/guide" title="Guide: how smart charging works"><ha-icon icon="mdi:information-outline" style="--mdc-icon-size:20px;color:#8ab4f8;vertical-align:-2px"></ha-icon></a>
              The defaults work for most installations. The advice in the report tells you when a change would help.
            grid_options:
              columns: 12
          - type: tile
            entity: input_boolean.hesc_show_thresholds
            name: Thresholds
            icon: mdi:tune-vertical
            hide_state: true
            vertical: false
            features_position: inline
            features:
              - type: toggle
            grid_options:
              columns: 12
