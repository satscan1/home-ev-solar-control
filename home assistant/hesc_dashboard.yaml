          - type: markdown
            content: |-
              ### Waar je kijkt

              - **Status** op het dashboard: één regel met wat HESC nu doet en waarom.
              - **Prijsgrafiek** (tabblad *Charge plan*): oranje = gepland, blauwgroen = goedkope kans, grijs = verwachte prijs.
              - **Rapport**: alles wat HESC gemeten en besloten heeft, voor jezelf of als je om hulp vraagt.

              Zie ook (Engels): [How it works](https://github.com/satscan1/home-ev-solar-control/blob/main/docs/03-how-it-works.md) voor de technische details, en [A day in practice](https://github.com/satscan1/home-ev-solar-control/blob/main/docs/06-a-day-in-practice.md) voor één echte dag.
