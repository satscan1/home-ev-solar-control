          <a href="{{ state_attr('sensor.hesc_notice', 'link') or '/home-ev-solar-control/settings' }}"><font color="{{ c }}">{{ '⛔' if p == 1 else ('⚠' if p == 2 else 'ℹ') }} P{{ p }} · {{ n }}{{ (' · ' ~ (as_timestamp(state_attr('sensor.hesc_notice', 'since')) | timestamp_custom('%H:%M'))) if state_attr('sensor.hesc_notice', 'since') else '' }} ›</font></a>
          {%- else -%}
          <a href="https://github.com/satscan1/home-ev-solar-control"><font color="#64748b">✓ No notices · HESC on GitHub ›</font></a>
          {%- endif -%}</sup></div>
