                custom: |
                  EVAL:function({ seriesIndex, dataPointIndex, w }) {
                    const idx = w.config.series.findIndex(s => s.name === 'Solar forecast');
                    const series = idx >= 0 ? w.config.series[idx] : null;
                    const point = series && series.data ? series.data[dataPointIndex] : null;
                    if (!point) {
                      return '';
                    }
                    const raw = Array.isArray(point) ? { x: point[0], y: point[1] } : point;
                    const date = new Date(raw.x);
                    const pad = n => String(n).padStart(2, '0');
                    const labels = {
                      go: ['#4caf50', 'EV can start on solar'],
                      hold: ['#ff9800', 'Enough to keep charging, not to start'],
                      low: ['#9e9e9e', 'Not enough sun']
                    };
                    const label = labels[raw.band] || labels.low;
                    const fmt = v => Number.isFinite(v) ? Math.round(v).toLocaleString() + ' W' : '—';
                    const row = (name, value, colour) =>
                      '<div style="display:flex;align-items:center;gap:6px;margin:2px 0;">' +
                        '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + colour + ';flex-shrink:0;"></span>' +
                        '<span style="color:var(--secondary-text-color);min-width:88px;font-weight:700;">' + name + '</span>' +
                        '<span style="font-weight:700;margin-left:auto;">' + value + '</span>' +
                      '</div>';
                    return (
                      '<div style="padding:8px 10px;font-size:10px;width:max-content;max-width:260px;box-sizing:border-box;background:color-mix(in srgb,var(--ha-card-background,var(--card-background-color)) 35%,transparent);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);border-radius:6px;border:1px solid var(--divider-color);color:var(--primary-text-color);font-family:inherit;box-shadow:none;font-weight:600;">' +
                        '<div style="margin-bottom:4px;">' + pad(date.getHours()) + ':' + pad(date.getMinutes()) + ' – ' + pad(new Date(raw.x + 1800000).getHours()) + ':' + pad(new Date(raw.x + 1800000).getMinutes()) + '</div>' +
                        row('Forecast', fmt(raw.y), '#8B5CF6') +
                        row('Used for control', fmt(raw.decide), '#A78BFA') +
                        row(label[1], '', label[0]) +
                      '</div>'
                    );
                  }
            series:
              - entity: sensor.solcast_pv_forecast_power_now
                name: Forecast now
                color: '#8B5CF6'
                unit: ' W'
                float_precision: 0
                extend_to: false
                show:
                  in_chart: false
                  in_header: true
                  name_in_header: true
                  legend_value: false
                data_generator: |
                  const v = Number(entity.state);
                  if (!Number.isFinite(v)) { return []; }
                  return [[Date.now(), v]];
              - entity: input_number.hesc_p_start
                name: Start threshold
                color: '#4caf50'
                unit: ' W'
                float_precision: 0
                extend_to: false
                show:
                  in_chart: false
                  in_header: true
                  name_in_header: true
                  legend_value: false
                data_generator: |
                  const v = Number(entity.state);
                  if (!Number.isFinite(v)) { return []; }
                  return [[Date.now(), v]];
              - entity: sensor.solcast_pv_forecast_forecast_today
                name: Solar forecast
                type: column
                float_precision: 0
                extend_to: false
                show:
                  in_header: false
                  legend_value: false
                data_generator: |
                  // Half-hourly Solcast forecast for today + tomorrow.
                  // Bar height = normal forecast. Bar colour follows the HESC settings:
                  // the forecast estimate chosen in Settings (hesc_forecast_attribute)
                  // compared with the start and hold thresholds.
                  const st = (id) => hass.states[id];
                  const num = (id, fallback) => {
                    const v = Number(st(id) && st(id).state);
                    return Number.isFinite(v) ? v : fallback;
                  };

                  const pStart = num('input_number.hesc_p_start', 1500);
                  const pHold = num('input_number.hesc_p_hold', 1200);

                  const attrSetting = String(
                    (st('input_text.hesc_forecast_attribute') || {}).state || 'estimate10'
                  );
                  const key = {
                    estimate: 'pv_estimate',
                    estimate10: 'pv_estimate10',
                    estimate90: 'pv_estimate90'
                  }[attrSetting] || 'pv_estimate10';

                  const days = [
                    'sensor.solcast_pv_forecast_forecast_today',
                    'sensor.solcast_pv_forecast_forecast_tomorrow'
                  ];

                  const colours = {
                    go: '#4caf50',
                    hold: '#ff9800',
                    low: '#9e9e9e',
                    now: '#009ac7'
                  };

                  const withOpacity = (hex, opacity) => {
                    const v = hex.replace('#', '');
                    return 'rgba(' + parseInt(v.slice(0, 2), 16) + ', ' +
                      parseInt(v.slice(2, 4), 16) + ', ' +
                      parseInt(v.slice(4, 6), 16) + ', ' + opacity + ')';
                  };

                  const startOfTomorrow = new Date();
                  startOfTomorrow.setHours(24, 0, 0, 0);
                  const tomorrowTs = startOfTomorrow.getTime();
                  const now = Date.now();
                  const hour = 30 * 60 * 1000; // one slot = 30 minutes

                  const points = [];
                  days.forEach((id) => {
                    const at = (st(id) || {}).attributes || {};
                    // Half-hourly needs Solcast option 'attr_brk_halfhourly'; fall back to hourly data.
                    const half = Array.isArray(at.detailedForecast) && at.detailedForecast.length > 0;
                    const rows = half ? at.detailedForecast : (at.detailedHourly || []);
                    const slot = half ? 30 * 60 * 1000 : 60 * 60 * 1000;
                    rows.forEach((row) => {
                      const ts = new Date(row.period_start).getTime();
                      const forecast = Number(row.pv_estimate) * 1000;
                      const decide = Number(row[key]) * 1000;
                      if (!Number.isFinite(ts) || !Number.isFinite(forecast)) {
                        return;
                      }
                      const band = decide >= pStart ? 'go' : (decide >= pHold ? 'hold' : 'low');
                      const isNow = now >= ts && now < ts + slot;
                      const colour = isNow ? colours.now : colours[band];
                      points.push({
                        x: ts,
                        y: Math.round(forecast),
                        fillColor: ts >= tomorrowTs && !isNow ? withOpacity(colour, 0.55) : colour,
                        band: band,
                        decide: Math.round(decide)
                      });
                    });
                  });

                  return points;
            grid_options:
              columns: full
              rows: 5
          - type: custom:button-card
            entity: sensor.solcast_pv_forecast_forecast_today
            show_name: false
            show_icon: false
            show_state: false
            show_label: false
            tap_action:
              action: none
            hold_action:
              action: none
            triggers_update:
              - sensor.solcast_pv_forecast_forecast_today
              - sensor.solcast_pv_forecast_forecast_tomorrow
              - input_number.hesc_p_start
              - input_number.hesc_p_hold
              - input_text.hesc_forecast_attribute
              - sun.sun
            custom_fields:
              bar: |-
                [[[
                const st = (id) => states[id];
                const num = (id, fb) => { const v = Number(st(id) && st(id).state); return Number.isFinite(v) ? v : fb; };
                const pStart = num('input_number.hesc_p_start', 1500);
                const pHold = num('input_number.hesc_p_hold', 1200);
                const attr = String((st('input_text.hesc_forecast_attribute') || {}).state || 'estimate10');
                const key = { estimate: 'pv_estimate', estimate10: 'pv_estimate10', estimate90: 'pv_estimate90' }[attr] || 'pv_estimate10';
                const lat = hass.config.latitude, lon = hass.config.longitude;
                const pad = (n) => String(n).padStart(2, '0');
                const hm = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());
                const SCALE_START = 4, SCALE_END = 22; // 04:00 - 22:00 local time
                const pct = (d) => {
                  const h = d.getHours() + d.getMinutes() / 60;
                  return Math.max(0, Math.min(100, (h - SCALE_START) / (SCALE_END - SCALE_START) * 100));
                };
                // Sunrise / sunset (NOAA approximation), returned as local Date objects.
                const sunTimes = (day) => {
                  const rad = Math.PI / 180;
                  const y = day.getFullYear(), m = day.getMonth(), dd = day.getDate();
                  const doy = Math.round((Date.UTC(y, m, dd) - Date.UTC(y, 0, 0)) / 864e5);
                  const g = 2 * Math.PI / 365 * (doy - 1);
                  const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
                  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
                  const ha = Math.acos(Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(decl)) - Math.tan(lat * rad) * Math.tan(decl)) / rad;
                  const base = Date.UTC(y, m, dd);
                  return [new Date(base + (720 - 4 * (lon + ha) - eq) * 60000), new Date(base + (720 - 4 * (lon - ha) - eq) * 60000)];
                };
                const now = new Date();
                const dayRow = (entity, label, dayDate, isToday) => {
                  const at = (st(entity) || {}).attributes || {};
                  // Half-hourly needs Solcast option 'attr_brk_halfhourly'; fall back to hourly data.
                  const half = Array.isArray(at.detailedForecast) && at.detailedForecast.length > 0;
                  const rows = half ? at.detailedForecast : (at.detailedHourly || []);
                  const slotMin = half ? 30 : 60;
                  const [rise, set] = sunTimes(dayDate);
                  // Classify each 30-minute slot with the same rule as the control:
                  // green = can start (>= start threshold), orange = keeps charging (>= hold, right after green).
                  let phase = '';
                  let slots = '';
                  let chargeMin = 0;
                  rows.forEach((r) => {
                    const t = new Date(r.period_start);
                    const v = Number(r[key]) * 1000;
                    let cls = '';
                    if (v >= pStart) { phase = 'go'; cls = 'go'; }
                    else if (v >= pHold && phase) { phase = 'hold'; cls = 'hold'; }
                    else { phase = ''; }
                    if (!cls) { return; }
                    const end = new Date(t.getTime() + slotMin * 60000);
                    if (end <= rise || t >= set) { return; }
                    chargeMin += slotMin;
                    const past = isToday && end <= now;
                    const left = pct(t), width = pct(end) - pct(t);
                    const colour = cls === 'go' ? '#4caf50' : '#ff9800';
                    slots += '<div style="position:absolute;top:0;bottom:0;left:' + left + '%;width:calc(' + width + '% - 1px);background:' + colour + ';opacity:' + (past ? 0.35 : 1) + ';border-radius:2px;" title="' + hm(t) + '–' + hm(end) + ' · ' + (cls === 'go' ? 'can start' : 'keeps charging') + ' (~' + (v / 1000).toFixed(1) + ' kW forecast)"></div>';
                  });
                  const track = '<div style="position:absolute;top:0;bottom:0;left:0;right:0;background:rgba(255,255,255,0.04);border-radius:3px;"></div>';
                  const daylight = '<div style="position:absolute;top:0;bottom:0;left:' + pct(rise) + '%;width:' + (pct(set) - pct(rise)) + '%;background:rgba(255,255,255,0.10);border-radius:3px;"></div>';
                  const nowMark = isToday && now > rise && now < set
                    ? '<div style="position:absolute;top:-3px;bottom:-3px;left:' + pct(now) + '%;width:2px;background:#009ac7;border-radius:1px;"></div>' : '';
                  const hours = (chargeMin / 60).toLocaleString('en-GB', { maximumFractionDigits: 1 });
                  const info = '☀ ' + hm(rise) + ' – ' + hm(set) + ' · ' + (chargeMin ? hours + ' h solar charging' : 'no solar charging expected');
                  return '<div style="display:flex;align-items:flex-start;gap:8px;margin-top:10px;">' +
                    '<div style="flex:0 0 72px;font-weight:700;font-size:13px;line-height:14px;">' + label + '</div>' +
                    '<div style="flex:1 1 auto;min-width:0;">' +
                      '<div style="position:relative;height:14px;">' + track + daylight + slots + nowMark + '</div>' +
                      '<div style="font-size:11px;color:var(--secondary-text-color);margin-top:3px;">' + info + '</div>' +
                    '</div>' +
                  '</div>';
                };
                const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
                let ticks = '';
                [6, 9, 12, 15, 18, 21].forEach((h) => {
                  const p = (h - SCALE_START) / (SCALE_END - SCALE_START) * 100;
                  ticks += '<span style="position:absolute;left:' + p + '%;transform:translateX(-50%);">' + pad(h) + ':00</span>';
                });
                return '<div style="text-align:left;width:100%;box-sizing:border-box;padding:10px 14px;">' +
                  '<div style="font-weight:700;font-size:14px;">🔌 Expected solar charging</div>' +
                  dayRow('sensor.solcast_pv_forecast_forecast_today', 'Today', now, true) +
                  dayRow('sensor.solcast_pv_forecast_forecast_tomorrow', 'Tomorrow', tomorrow, false) +
                  '<div style="display:flex;gap:8px;margin-top:6px;"><div style="flex:0 0 72px;"></div>' +
                  '<div style="flex:1 1 auto;position:relative;height:12px;font-size:10px;color:var(--secondary-text-color);">' + ticks + '</div></div>' +
                '</div>';
                ]]]
            styles:
              card:
                - 'padding: 0px'
                - 'cursor: default'
                - height: 249px
              grid:
                - grid-template-areas: '"bar"'
                - grid-template-columns: 1fr
