              x: |-
                [[[

                // ---- real data: sensor.hesc_charging_costs (Node-RED, v1.5) ----
                const A = (states['sensor.hesc_charging_costs'] || {}).attributes || {};
                const sv = (id) => Number((states[id] || {}).state) || 0;
                const allIn = (states['input_boolean.hesc_costs_all_in'] || {}).state === 'on';
                const feed = sv('input_number.hesc_feed_in_price');
                const mk = allIn ? 0 : sv('input_number.hesc_costs_markup');
                const vat = allIn ? 0 : sv('input_number.hesc_costs_vat');
                const since = A.since ? new Date(A.since + 'T00:00:00') : null;
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const conv = (r, dateStr) => ({ d: new Date(dateStr + 'T12:00:00'), sun: Number(r[1]) || 0, grid: Number(r[2]) || 0,
                  gridCost: ((Number(r[3]) || 0) + (Number(r[2]) || 0) * mk) * (1 + vat / 100), sunValue: (Number(r[1]) || 0) * feed, noPrice: Number(r[4]) || 0 });
                const days = (A.days || []).map((r) => conv(r, r[0]));
                const months = (A.months || []).map((r) => Object.assign(conv(r, r[0] + '-15'), { key: r[0] }));
                const sum = (list) => list.reduce((a, x) => ({ sun: a.sun + x.sun, grid: a.grid + x.grid, gridCost: a.gridCost + x.gridCost, sunValue: a.sunValue + x.sunValue, noPrice: a.noPrice + (x.noPrice || 0) }), { sun: 0, grid: 0, gridCost: 0, sunValue: 0, noPrice: 0 });
                const PA = ((states['sensor.hesc_prices'] || {}).attributes || {}); const SYM = PA.symbol || '€', MIN = PA.minor || 'ct'; const DEC = PA.decimal === '.' ? '.' : ','; // v2.0.0 (11-10-2026): decimal mark of the country // v2.0.0: currency of the prices
                    const AFTER = PA.symbol_after === true || PA.symbol_after === 'True' || PA.symbol_after === 'true';
                    const eur = (v) => AFTER ? (v.toFixed(2).replace('.', DEC) + ' ' + SYM) : (SYM + (DEC === '.' ? '' : ' ') + v.toFixed(2).replace('.', DEC));
                const n1 = (v) => v.toFixed(1).replace('.', DEC);
                const isoWeek = (dt) => { const t = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate())); const dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn); const y = t.getUTCFullYear(); const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 86400000 + 1) / 7); return { y: y, w: w }; };
                const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                const bar = (a, max) => { const t = a.sun + a.grid; const w = max > 0 ? Math.max(t / max * 100, t > 0 ? 6 : 0) : 0; const sp = t > 0 ? a.sun / t * 100 : 0;
                  return '<div style="height:8px;border-radius:4px;background:rgba(148,163,184,.15);overflow:hidden;margin:6px 0 4px"><div style="width:' + w + '%;height:100%;display:flex"><div style="width:' + sp + '%;background:#22c55e"></div><div style="flex:1;background:#94a3b8"></div></div></div>'; };
                const cost = (a) => a.gridCost + a.sunValue;
                const trend = (a, prev) => { if (!prev) return '<span style="color:var(--secondary-text-color)">•</span>'; const c = cost(a), p = cost(prev); if (p === 0 && c === 0) return '<span style="color:var(--secondary-text-color)">=</span>'; if (c > p * 1.05) return '<span style="color:#f87171">▲</span>'; if (c < p * 0.95) return '<span style="color:#22c55e">▼</span>'; return '<span style="color:var(--secondary-text-color)">=</span>'; };
                const tile = (label, a, max, prev, dim, emptyText) => { const t = a.sun + a.grid; const pct = t > 0 ? Math.round(a.sun / t * 100) : 0;
                  return '<div style="border:1px solid var(--divider-color);border-radius:10px;padding:8px 10px;' + (dim ? 'opacity:.35;' : '') + '">' +
                    '<div style="display:flex;gap:6px;align-items:center;font-size:12px;color:var(--secondary-text-color)">' + trend(a, prev) + '<span>' + label + '</span></div>' +
                    bar(a, max) +
                    '<div style="font-size:16px;font-weight:600;color:var(--primary-text-color)">' + (t > 0 ? eur(cost(a)) : '–') + '</div>' +
                    '<div style="font-size:11px;color:var(--secondary-text-color)">' + (t > 0 ? n1(t) + ' kWh · ' + pct + '% ☀' : (emptyText !== undefined ? emptyText : 'not charged')) + '</div></div>'; };
                const ZERO = { sun: 0, grid: 0, gridCost: 0, sunValue: 0, noPrice: 0 };

                const P = entity ? entity.state : 'Days';
                let a = ZERO, scope = '';
                if (P === 'Days') { a = sum(days.filter((x) => x.d.getFullYear() === today.getFullYear() && x.d.getMonth() === today.getMonth())); scope = 'this month'; }
                else if (P === 'Weeks') { const from = new Date(today); from.setDate(from.getDate() - 7 * 12 + 1); a = sum(days.filter((x) => x.d >= from)); scope = 'last 12 weeks'; }
                else if (P === 'Months') { const from = new Date(today.getFullYear(), today.getMonth() - 11, 1); a = sum(months.filter((x) => x.d >= from)); scope = 'last 12 months'; }
                else if (P === 'Quarters') { const from = new Date(today.getFullYear(), Math.floor(today.getMonth() / 3) * 3 - 9, 1); a = sum(months.filter((x) => x.d >= from)); scope = 'last 4 quarters'; }
                else { a = sum(months.filter((x) => x.d.getFullYear() === today.getFullYear())); scope = 'this year'; }
                const t = a.sun + a.grid; const pct = t > 0 ? Math.round(a.sun / t * 100) : 0;
                const avg = t > 0 ? (a.gridCost + a.sunValue) / t * 100 : 0;
                const box = (label, value, colour) => '<div style="flex:1;min-width:110px"><div style="font-size:11px;color:var(--secondary-text-color)">' + label + '</div><div style="font-size:20px;font-weight:700;color:' + colour + '">' + value + '</div></div>';
                const how = allIn ? 'price as given by the price source (all-in)' : ('(price + ' + eur(mk) + ' mark-up) × ' + (1 + vat / 100).toFixed(3).replace('.', DEC) + ' VAT');
                return '<div style="font-size:12px;color:var(--secondary-text-color);margin-bottom:6px">Totals · ' + scope + (since ? ' · counting since ' + since.toLocaleDateString('nl-NL') : '') + '</div>' +
                  '<div style="display:flex;flex-wrap:wrap;gap:12px">' +
                  box('Charged', n1(t) + ' kWh', 'var(--primary-text-color)') +
                  box('From sun', n1(a.sun) + ' kWh · ' + pct + '%', '#22c55e') +
                  box('From grid', n1(a.grid) + ' kWh', '#94a3b8') +
                  box('Grid cost', eur(a.gridCost), 'var(--primary-text-color)') +
                  box('Solar value (feed-in)', eur(a.sunValue), '#22c55e') +
                  box('Average', avg.toFixed(1).replace('.', DEC) + ' ' + MIN + '/kWh', 'var(--primary-text-color)') +
                  '</div>' + bar(a, t) +
                  '<div style="font-size:11px;color:var(--secondary-text-color)">Grid: ' + how + ' · sun: ' + eur(feed) + '/kWh' + (a.noPrice > 0 ? ' · ⚠ ' + n1(a.noPrice) + ' kWh from the grid without a known price (counted without energy price)' : '') + '</div>';
                ]]]
            grid_options:
              columns: full
          - type: custom:button-card
            entity: input_select.hesc_costs_period
            show_name: false
            show_icon: false
            show_state: false
            tap_action:
              action: none
            hold_action:
              action: none
            triggers_update:
              - sensor.hesc_charging_costs
              - input_boolean.hesc_costs_all_in
              - input_number.hesc_costs_markup
              - input_number.hesc_costs_vat
              - input_number.hesc_feed_in_price
            styles:
              card:
                - padding: 12px 14px
                - cursor: default
              grid:
                - grid-template-areas: '"x"'
                - grid-template-columns: 1fr
              custom_fields:
                x:
                  - text-align: left
                  - width: 100%
            custom_fields:
              x: |-
                [[[

                // ---- real data: sensor.hesc_charging_costs (Node-RED, v1.5) ----
                const A = (states['sensor.hesc_charging_costs'] || {}).attributes || {};
                const sv = (id) => Number((states[id] || {}).state) || 0;
                const allIn = (states['input_boolean.hesc_costs_all_in'] || {}).state === 'on';
                const feed = sv('input_number.hesc_feed_in_price');
                const mk = allIn ? 0 : sv('input_number.hesc_costs_markup');
                const vat = allIn ? 0 : sv('input_number.hesc_costs_vat');
                const since = A.since ? new Date(A.since + 'T00:00:00') : null;
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const conv = (r, dateStr) => ({ d: new Date(dateStr + 'T12:00:00'), sun: Number(r[1]) || 0, grid: Number(r[2]) || 0,
                  gridCost: ((Number(r[3]) || 0) + (Number(r[2]) || 0) * mk) * (1 + vat / 100), sunValue: (Number(r[1]) || 0) * feed, noPrice: Number(r[4]) || 0 });
                const days = (A.days || []).map((r) => conv(r, r[0]));
                const months = (A.months || []).map((r) => Object.assign(conv(r, r[0] + '-15'), { key: r[0] }));
                const sum = (list) => list.reduce((a, x) => ({ sun: a.sun + x.sun, grid: a.grid + x.grid, gridCost: a.gridCost + x.gridCost, sunValue: a.sunValue + x.sunValue, noPrice: a.noPrice + (x.noPrice || 0) }), { sun: 0, grid: 0, gridCost: 0, sunValue: 0, noPrice: 0 });
                const PA = ((states['sensor.hesc_prices'] || {}).attributes || {}); const SYM = PA.symbol || '€', MIN = PA.minor || 'ct'; const DEC = PA.decimal === '.' ? '.' : ','; // v2.0.0 (11-10-2026): decimal mark of the country // v2.0.0: currency of the prices
                    const AFTER = PA.symbol_after === true || PA.symbol_after === 'True' || PA.symbol_after === 'true';
                    const eur = (v) => AFTER ? (v.toFixed(2).replace('.', DEC) + ' ' + SYM) : (SYM + (DEC === '.' ? '' : ' ') + v.toFixed(2).replace('.', DEC));
                const n1 = (v) => v.toFixed(1).replace('.', DEC);
                const isoWeek = (dt) => { const t = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate())); const dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn); const y = t.getUTCFullYear(); const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 86400000 + 1) / 7); return { y: y, w: w }; };
                const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                const bar = (a, max) => { const t = a.sun + a.grid; const w = max > 0 ? Math.max(t / max * 100, t > 0 ? 6 : 0) : 0; const sp = t > 0 ? a.sun / t * 100 : 0;
                  return '<div style="height:8px;border-radius:4px;background:rgba(148,163,184,.15);overflow:hidden;margin:6px 0 4px"><div style="width:' + w + '%;height:100%;display:flex"><div style="width:' + sp + '%;background:#22c55e"></div><div style="flex:1;background:#94a3b8"></div></div></div>'; };
                const cost = (a) => a.gridCost + a.sunValue;
                const trend = (a, prev) => { if (!prev) return '<span style="color:var(--secondary-text-color)">•</span>'; const c = cost(a), p = cost(prev); if (p === 0 && c === 0) return '<span style="color:var(--secondary-text-color)">=</span>'; if (c > p * 1.05) return '<span style="color:#f87171">▲</span>'; if (c < p * 0.95) return '<span style="color:#22c55e">▼</span>'; return '<span style="color:var(--secondary-text-color)">=</span>'; };
                const tile = (label, a, max, prev, dim, emptyText) => { const t = a.sun + a.grid; const pct = t > 0 ? Math.round(a.sun / t * 100) : 0;
                  return '<div style="border:1px solid var(--divider-color);border-radius:10px;padding:8px 10px;' + (dim ? 'opacity:.35;' : '') + '">' +
                    '<div style="display:flex;gap:6px;align-items:center;font-size:12px;color:var(--secondary-text-color)">' + trend(a, prev) + '<span>' + label + '</span></div>' +
                    bar(a, max) +
                    '<div style="font-size:16px;font-weight:600;color:var(--primary-text-color)">' + (t > 0 ? eur(cost(a)) : '–') + '</div>' +
                    '<div style="font-size:11px;color:var(--secondary-text-color)">' + (t > 0 ? n1(t) + ' kWh · ' + pct + '% ☀' : (emptyText !== undefined ? emptyText : 'not charged')) + '</div></div>'; };
                const ZERO = { sun: 0, grid: 0, gridCost: 0, sunValue: 0, noPrice: 0 };

                const P = entity ? entity.state : 'Days';
                let out = '';
                if (!A.days) return '<div style="color:var(--secondary-text-color)">No data yet. HESC starts counting as soon as the EV charges.</div>';
                if (P === 'Days') {
                  const y = today.getFullYear(), m = today.getMonth();
                  const first = new Date(y, m, 1); const nDays = new Date(y, m + 1, 0).getDate();
                  const off = (first.getDay() + 6) % 7;
                  const byDay = {}; days.forEach((x) => { if (x.d.getFullYear() === y && x.d.getMonth() === m) byDay[x.d.getDate()] = x; });
                  const list = Object.values(byDay); const max = Math.max(...list.map((x) => x.sun + x.grid), 1);
                  out += '<div style="font-size:14px;font-weight:600;margin-bottom:8px">' + MONTHS[m] + ' ' + y + '</div>';
                  out += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">';
                  ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach((w) => { out += '<div style="text-align:center;font-size:11px;color:var(--secondary-text-color)">' + w + '</div>'; });
                  for (let i = 0; i < off; i++) out += '<div></div>';
                  for (let dd = 1; dd <= nDays; dd++) { const dt = new Date(y, m, dd); const x = byDay[dd];
                    const before = since && dt < since; const future = dt > today;
                    out += x ? tile(String(dd), x, max, byDay[dd - 1], false) : tile(String(dd), ZERO, max, null, true, before ? 'no data yet' : (future ? '' : 'not charged')); }
                  out += '</div>';
                } else {
                  const map = new Map();
                  const src = P === 'Weeks' ? days : months;
                  src.forEach((x) => { let k, label;
                    if (P === 'Weeks') { const w = isoWeek(x.d); k = w.y * 100 + w.w; label = 'Week ' + w.w + ' · ' + w.y; }
                    else if (P === 'Months') { k = x.d.getFullYear() * 100 + x.d.getMonth(); label = MONTHS[x.d.getMonth()] + ' ' + x.d.getFullYear(); }
                    else if (P === 'Quarters') { const q = Math.floor(x.d.getMonth() / 3) + 1; k = x.d.getFullYear() * 10 + q; label = 'Q' + q + ' ' + x.d.getFullYear(); }
                    else { k = x.d.getFullYear(); label = String(k); }
                    if (!map.has(k)) map.set(k, { label: label, items: [] }); map.get(k).items.push(x); });
                  const keys = [...map.keys()].sort((a, b) => b - a);
                  const take = { Weeks: 12, Months: 12, Quarters: 4, Year: 5 }[P];
                  const rows = keys.slice(0, take + 1).map((k) => ({ label: map.get(k).label, a: sum(map.get(k).items) }));
                  const shown = rows.slice(0, take); const max = Math.max(...shown.map((r) => r.a.sun + r.a.grid), 1);
                  out += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">';
                  shown.forEach((r, i) => { out += tile(r.label, r.a, max, rows[i + 1] ? rows[i + 1].a : null, false); });
                  out += '</div>';
                }
                return out;
                ]]]
            grid_options:
              columns: full
          - type: markdown
            content: '<small>▲ more expensive than the period before · ▼ cheaper · = about the same. Bar: <font color="#22c55e">■</font> sun <font color="#94a3b8">■</font> grid; bar length = kWh compared with the biggest period shown.</small>'
            grid_options:
              columns: full
          - type: tile
            entity: input_button.hesc_costs_export
            name: Export to spreadsheet (CSV)
            icon: mdi:file-delimited-outline
            color: blue
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.hesc_costs_export
            icon_tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.hesc_costs_export
            grid_options:
              columns: full
              rows: auto
          - type: markdown
            content: <small>{% set i = states('input_text.hesc_costs_export_info') %}{{ i if i not in ['unknown', 'unavailable', ''] else 'Not exported yet. Saves two files (per day and per month) in the hesc-data folder of your Home Assistant config; open them with Samba or the File editor.' }}</small>
            grid_options:
              columns: full
              rows: auto
