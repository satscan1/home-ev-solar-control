# Home EV Solar Control (HESC) v1.3.0 — dashboard
# Layout follows Home PV Control (badges, master-control toggles, live inputs, control states, apexcharts graphs).
# Requires: apexcharts-card (HACS). Optional: button-card (HACS) for the "Expected solar charging" bar;
# without it that bar stays hidden (checked via update.button_card_update). Optional: card-mod (tighter Live Inputs padding).
# Until the essentials are filled in, Main shows a welcome card with a setup checklist (binary_sensor.hesc_configuration_valid).
# Charge plan tab: the price chart follows the day-ahead price sensor chosen in Settings (no editing needed here).
# Charge plan tab: grey bars = expected prices (sensor.hesc_price_forecast from the Node-RED Price forecast), blue-green = cheap chances.
# The ⓘ next to the headings and the Guide badge on Main open the built-in guide: two hidden pages (guide, guide-nl).
# Add as a separate dashboard: Settings → Dashboards → Add → New from scratch → ⋮ → Raw configuration editor → paste.
title: Home EV Solar Control
views:
  - type: sections
    title: Main
    path: home-ev-solar-control
    icon: mdi:ev-station
    max_columns: 3
    badges:
      - type: entity
        entity: input_text.hesc_state
        name: HESC Status
        show_name: true
        show_state: true
        show_icon: true
        icon: mdi:ev-station
        visibility:
          - condition: state
            entity: binary_sensor.hesc_configuration_valid
            state: 'on'
      - type: entity
        entity: binary_sensor.hesc_diag_ev_connected
        name: EV
        show_name: true
        show_state: true
        show_icon: true
        visibility:
          - condition: state
            entity: binary_sensor.hesc_configuration_valid
            state: 'on'
      - type: entity
        entity: binary_sensor.hesc_diag_charger_solar_mode
        name: Solar mode
        show_name: true
        show_state: true
        show_icon: true
        visibility:
          - condition: state
            entity: binary_sensor.hesc_configuration_valid
            state: 'on'
      - type: entity
        entity: binary_sensor.hpvc_pv_limited
        name: HPVC limiting
        show_name: true
        show_state: true
        show_icon: true
        visibility:
          - condition: state
            entity: binary_sensor.hesc_configuration_valid
            state: 'on'
      - type: entity
        entity: binary_sensor.hesc_diag_release_active
        name: Release
        show_name: true
        show_state: true
        show_icon: true
        visibility:
          - condition: state
            entity: binary_sensor.hesc_diag_release_active
            state: 'on'
          - condition: state
            entity: binary_sensor.hesc_configuration_valid
            state: 'on'
      - type: entity
        entity: sensor.hesc_charge_plan
        name: Guide
        show_name: true
        show_state: false
        show_icon: true
        icon: mdi:book-open-variant
        color: blue
        tap_action:
          action: navigate
          navigation_path: /home-ev-solar-control/guide
        hold_action:
          action: navigate
          navigation_path: /home-ev-solar-control/guide-nl
    sections:
      - type: grid
        visibility:
          - condition: state
            entity: binary_sensor.hesc_configuration_valid
            state_not: 'on'
        cards:
          - type: markdown
            grid_options:
              columns: 12
            content: |-
              {%- set sa = is_state('input_boolean.hesc_standalone', 'on') -%}
              <ha-alert title="Welcome to Home EV Solar Control" alert-type="info">First fill in the essentials on the <b>Settings</b> tab: only three things about your charger. {{ 'Also pick your PV and grid power sensors there; everything else has a good default.' if sa else 'Everything else is taken over from Home PV Control or has a good default.' }} The dashboard appears as soon as HESC has what it needs.</ha-alert>

              {%- macro exists(e) -%}{{ e not in ['', 'unknown', 'unavailable'] and (states(e) != 'unknown' or state_attr(e, 'friendly_name') is not none) }}{%- endmacro -%}
              {%- macro now(e) -%}{%- set u = state_attr(e, 'unit_of_measurement') -%}{{ states(e) }}{{ ' ' ~ u if u else '' }}{%- endmacro -%}
              {%- set conn = states('input_text.hesc_ev_connected_sensor') | trim -%}
              {%- set pow = states('input_text.hesc_ev_power_sensor') | trim -%}
              {%- set mode = states('input_text.hesc_charger_mode_entity') | trim -%}
              {%- set solar = states('input_text.hesc_charger_eco_value') | trim -%}
              {%- set solar_ok = solar not in ['', 'unknown', 'unavailable'] -%}
              {%- set in_solar = states(mode) in (solar.split(',') | map('trim') | list) -%}
              {%- set pv = states('input_text.hesc_pv_power_sensor') | trim -%}
              {%- set grid = states('input_text.hesc_grid_power_sensor') | trim -%}
              {%- set fc = states('input_text.hesc_forecast_now_sensor') | trim -%}
              {%- set fa = states('input_text.hesc_forecast_attribute') | trim -%}
              {%- set hen = states('input_text.hesc_hpvc_enabled_entity') | trim -%}
              {%- set hlim = states('input_text.hesc_hpvc_limited_entity') | trim -%}
              {%- set from_hpvc = is_state('input_boolean.hesc_use_hpvc_sources', 'on') -%}
              {%- set req = [exists(conn) == 'True', exists(pow) == 'True', exists(mode) == 'True' and solar_ok] -%}
              {%- set done = req | select | list | count -%}
              {%- set ok = '✅' -%}{%- set no = '❌' -%}
              {%- set pr = state_attr('sensor.hesc_charger_profile', 'profile') or {} -%}
              {%- macro sug(key, good) -%}{%- if not good and (pr.get(key) or []) | count > 0 -%}<br>&nbsp;&nbsp;💡 Suggested: {{ pr.get(key) | map('string') | map('regex_replace', '^(.*)$', '<code>\\1</code>') | join(' or ') }}{%- endif -%}{%- endmacro -%}
              **Your charger ({{ done }} of 3 done)**
              🔌 **Charger type**: {{ (pr.type ~ (' · tested' if pr.tested else ' · not tested yet, check it in shadow mode') ~ (' · ' ~ pr.note if pr.note else '')) if pr.get('known') else ('Other: fill in the fields yourself' if pr.get('type') == 'Other (manual)' else 'pick your charger above, HESC then fills in what it can') }}
              {{ ok if req[0] else no }} **EV connected**: {{ '<code>' ~ conn ~ '</code> · now ' ~ states(conn) if req[0] else 'pick the sensor that shows the car is plugged in' }}{{ sug('connected', req[0]) }}
              {{ ok if req[1] else no }} **Charging power**: {{ '<code>' ~ pow ~ '</code> · now ' ~ now(pow) if req[1] else 'pick the sensor with the charging power (W or kW)' }}{{ sug('power', req[1]) }}
              {{ ok if req[2] else no }} **Solar mode**: {{ '<code>' ~ mode ~ '</code> = <code>' ~ solar ~ '</code> · now ' ~ states(mode) ~ (' (solar mode)' if in_solar else '') if req[2] else 'pick the charger mode entity and the value that means solar charging' }}{{ sug('mode', req[2]) }}

              **{{ 'Sources' if sa else 'Taken over automatically' }}**
              {{ ok if exists(pv) == 'True' else no }} **PV power**: <code>{{ pv or '–' }}</code>{{ ' (from HPVC)' if from_hpvc else '' }} · now {{ now(pv) }}
              {{ ok if exists(grid) == 'True' else '⚪' }} **Grid power**: <code>{{ grid or '–' }}</code>{{ ' (from HPVC)' if from_hpvc else '' }}{{ ' · now ' ~ now(grid) if exists(grid) == 'True' else ' · optional' }}
              {{ ok if exists(fc) == 'True' else no }} **Solar forecast**: <code>{{ fc or '–' }}</code>{{ ' (' ~ fa ~ ')' if fa else '' }} · now {{ state_attr(fc, fa) if fa else states(fc) }} W
              {%- if not sa %}{{ ok if exists(hen) == 'True' and exists(hlim) == 'True' else no }} **HPVC**: {{ 'found' if exists(hen) == 'True' and exists(hlim) == 'True' else 'not found — is Home PV Control installed?' }}{% endif %}

              [➡️ Open Settings](/home-ev-solar-control/settings)
      - type: grid
        cards:
          - type: markdown
            content: |-
              ### 🎛️ EV Solar Master Control <small>· HESC v1.3.0</small> <a href="/home-ev-solar-control/guide" title="Guide: how smart charging works"><ha-icon icon="mdi:information-outline" style="--mdc-icon-size:20px;color:#8ab4f8;vertical-align:-2px"></ha-icon></a>
              <small>Starts solar charging on forecast sun by asking HPVC for a temporary PV release (HPVC 1.5.1 or newer). Shadow mode: only evaluates, never asks.</small>
            grid_options:
              columns: 12
              rows: 2
          - type: tile
            entity: input_boolean.hesc_enabled
            name: Enable HESC
            icon: mdi:ev-station
            hide_state: true
            vertical: false
            features_position: inline
            features:
              - type: toggle
          - type: tile
            entity: input_boolean.hesc_shadow_mode
            name: Shadow mode (evaluate only)
            icon: mdi:ghost-outline
            hide_state: true
            vertical: false
            features_position: inline
            features:
              - type: toggle
          - type: conditional
            conditions:
              - entity: input_boolean.hesc_owns_hpvc_off
                state: 'on'
            card:
              type: tile
              entity: input_boolean.hesc_owns_hpvc_off
              name: HESC switched HPVC off
              icon: mdi:key-variant
              color: amber
          - type: conditional
            conditions:
              - entity: binary_sensor.hpvc_external_release_active
                state: 'on'
            card:
              type: tile
              entity: binary_sensor.hpvc_external_release_active
              name: HPVC released PV
              icon: mdi:solar-power-variant
              color: green
          - type: conditional
            conditions:
              - entity: input_boolean.hesc_report_ready
                state: 'off'
            card:
              type: tile
              entity: input_button.hesc_generate_report
              name: Generate report
              icon: mdi:file-document-plus-outline
              color: blue
              hide_state: true
              tap_action:
                action: perform-action
                perform_action: input_button.press
                target:
                  entity_id: input_button.hesc_generate_report
              icon_tap_action:
                action: perform-action
                perform_action: input_button.press
                target:
                  entity_id: input_button.hesc_generate_report
            grid_options:
              columns: 12
          - type: conditional
            conditions:
              - entity: input_boolean.hesc_report_ready
                state: 'on'
            card:
              type: tile
              entity: input_boolean.hesc_report_ready
              name: View report
              icon: mdi:file-document-check-outline
              color: green
              state_content: []
              hide_state: true
              tap_action:
                action: url
                url_path: /local/hesc/open.html
              icon_tap_action:
                action: url
                url_path: /local/hesc/open.html
              grid_options:
                columns: 6
            grid_options:
              columns: 12
        visibility:
          - condition: state
            entity: binary_sensor.hesc_configuration_valid
            state: 'on'
      - type: grid
        cards:
          - type: markdown
            title: 📊 Status
            content: |-
              {% set st = states('input_text.hesc_state') %}
              {% set rs = states('input_text.hesc_reason') %}
              {% set la = states('input_text.hesc_last_action') %}
              {% set lae = states.input_text.hesc_last_action %}
              {% set la_h = ((now() - lae.last_changed).total_seconds() / 3600) if lae else 999 %}
              {% set la_d = (lae.last_changed | as_local).date() if lae else none %}
              {% set la_day = '' if (la_d is none or la_d == now().date()) else ('yesterday ' if la_d == (now() - timedelta(days=1)).date() else (lae.last_changed | as_local).strftime('%a ')) %}
              {% set i1 = states('input_text.hesc_insight_1') %}
              {% set i2 = states('input_text.hesc_insight_2') %}
              {% set adv = states('input_text.hesc_advice') %}
              {% set r = i1 | regex_findall('(\\d+) releases \\((\\d+) ok, (\\d+) failed\\)') %}
              {% set ses = i1 | regex_findall('(\\d+) solar sessions') %}
              {% set pct = i2 | regex_findall('(\\d+)%') %}
              {% set ev = i2 | regex_findall('EV ([\\d.]+) kWh') %}
              {% set evs = i2 | regex_findall('([\\d.]+) kWh solar') %}
              {% set col = adv | regex_findall('(\\d+) of (\\d+)') %}
              | | |
              |:--|:--|
              | **State** | {{ st.replace('[shadow] ', '') }}{{ ' · ' ~ rs if rs not in ['', 'unknown', 'unavailable'] }}{{ ' · shadow' if st.startswith('[shadow]') }} |
              {%- if la not in ['', 'unknown', 'unavailable'] and la_h <= 36 %}
              | **Last action** | {{ la_day }}{{ la }} |
              {%- endif %}
              | **Today** | {{ ses[0] if ses else 0 }} solar sessions · {{ r[0][0] if r else 0 }} HPVC releases{{ ' (' ~ r[0][2] ~ ' failed)' if r and r[0][2] | int > 0 }} |
              {%- if ev %}
              | **EV today** | {{ ev[0] | float | round(0) | int }} kWh{{ ', ' ~ (evs[0] | float | round(0) | int) ~ ' from sun' if evs }} |
              {%- endif %}
              {%- if pct %}
              | **Sun vs forecast** | {{ pct[0] }} %¹ |
              {%- endif %}
              | **Advice** | {% if col %}not yet · {{ col[0][1] | int - col[0][0] | int }} more solar sessions needed{% elif adv in ['', 'unknown', 'unavailable'] %}–{% else %}available · see report{% endif %} |
              {% if pct %}
              <small>¹ actual solar power as % of the forecast, while the car was charging on sun</small>
              {% endif %}
            grid_options:
              columns: full
              rows: 5
        visibility:
          - condition: state
            entity: binary_sensor.hesc_configuration_valid
            state: 'on'
      - type: grid
        cards:
          - type: entities
            title: 🔌 Live Inputs
            state_color: true
            entities:
              - entity: sensor.hesc_diag_forecast_power
                name: Forecast now
              - entity: sensor.hesc_diag_forecast_cautious
                name: Cautious forecast now
              - entity: sensor.hesc_diag_pv_power
                name: Actual PV
              - entity: sensor.hesc_diag_ev_power
                name: EV charging power
              - type: conditional
                conditions:
                  - entity: input_boolean.hesc_use_irradiance
                    state: 'on'
                row:
                  entity: sensor.hesc_diag_irradiance
                  name: Irradiance (weather station)
            grid_options:
              columns: full
              rows: 5
            card_mod:
              style: '#states { padding-bottom: 6px; overflow: hidden; } .card-header { padding-bottom: 6px; }'
        visibility:
          - condition: state
            entity: binary_sensor.hesc_configuration_valid
            state: 'on'
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: entities
                title: 📈 Control States
                state_color: true
                entities:
                  - entity: binary_sensor.hesc_diag_ev_connected
                    name: EV connected
                  - entity: binary_sensor.hesc_diag_charger_solar_mode
                    name: Charger in solar mode
                  - entity: binary_sensor.hpvc_pv_limited
                    name: HPVC limiting PV
                  - entity: binary_sensor.hesc_diag_release_active
                    name: Release active
                card_mod:
                  style: 'ha-card { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: none; }'
              - type: history-graph
                hours_to_show: 12
                entities:
                  - entity: binary_sensor.hesc_diag_ev_connected
                    name: EV connected
                  - entity: binary_sensor.hesc_diag_charger_solar_mode
                    name: Solar mode
                  - entity: binary_sensor.hpvc_pv_limited
                    name: HPVC limiting
                  - entity: binary_sensor.hesc_diag_release_active
                    name: Release
                card_mod:
                  style: 'ha-card { border-top-left-radius: 0; border-top-right-radius: 0; border-top: none; margin-top: calc(-1 * var(--vertical-stack-card-gap, 8px)); }'
            grid_options:
              columns: full
        visibility:
          - condition: state
            entity: binary_sensor.hesc_configuration_valid
            state: 'on'
      - type: custom:apexcharts-card
        section_mode: true
        update_interval: 30s
        graph_span: 12h
        header:
          show: true
          title: ☀️ Solar forecast vs actual · EV
          show_states: true
          colorize_states: true
        yaxis:
          - id: main
            min: auto
            max: auto
            decimals: 0
            apex_config:
              title:
                text: W
          - id: raw_header
            show: false
            min: -50000
            max: 50000
            decimals: 0
        apex_config:
          chart:
            height: 456
            stacked: false
            toolbar:
              show: false
            zoom:
              enabled: false
            pan:
              enabled: false
            animations:
              enabled: false
          stroke:
            curve: smooth
            connectNulls: false
          fill:
            opacity: 0.55
          markers:
            size: 0
            hover:
              size: 5
              sizeOffset: 0
          tooltip:
            shared: true
            intersect: false
            followCursor: true
            theme: false
            custom: |
              EVAL:function({ series, dataPointIndex }) {

                const colors = [
                  '#8B5CF6',
                  '#F59E0B',
                  '#06B6D4'
                ];

                const names = [
                  'Forecast',
                  'PV actual',
                  'EV charging'
                ];

                let rows = '';

                // Only the first three visible graph series belong in the tooltip.
                for (let i = 0; i < 3; i++) {
                  const value =
                    series[i] && dataPointIndex < series[i].length
                      ? series[i][dataPointIndex]
                      : null;

                  const display =
                    value === null ||
                    value === undefined ||
                    !Number.isFinite(value)
                      ? '—'
                      : Math.round(Math.abs(value)).toLocaleString() + ' W';

                  rows +=
                    '<div style="display:flex;align-items:center;gap:6px;margin:2px 0;">' +
                      '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' +
                        colors[i] +
                        ';flex-shrink:0;"></span>' +
                      '<span style="color:var(--secondary-text-color);min-width:88px;font-weight:700;">' +
                        names[i] +
                        '</span>' +
                      '<span style="font-weight:700;margin-left:auto;">' +
                        display +
                      '</span>' +
                    '</div>';
                }

                return (
                  '<div style="padding:8px 10px;font-size:10px;width:max-content;max-width:240px;box-sizing:border-box;background:color-mix(in srgb,var(--ha-card-background,var(--card-background-color)) 35%,transparent);backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);border-radius:6px;border:1px solid var(--divider-color);color:var(--primary-text-color);font-family:inherit;box-shadow:none;font-weight:600;">' +
                    rows +
                  '</div>'
                );
              }
          grid:
            borderColor: var(--divider-color)
            strokeDashArray: 2
            xaxis:
              lines:
                show: true
            yaxis:
              lines:
                show: true
          xaxis:
            labels:
              datetimeUTC: false
              datetimeFormatter:
                hour: HH:mm
                day: d MMM
              style:
                fontSize: 11px
            tooltip:
              formatter: |
                EVAL:function(value) {
                  const date = new Date(value);

                  const months = [
                    'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                    'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'
                  ];

                  const pad = number =>
                    String(number).padStart(2, '0');

                  return (
                    pad(date.getDate()) +
                    ' ' +
                    months[date.getMonth()] +
                    ' · ' +
                    pad(date.getHours()) +
                    ':' +
                    pad(date.getMinutes())
                  );
                }
          dataLabels:
            enabled: false
          legend:
            show: false
          annotations:
            yaxis:
              - borderColor: var(--secondary-text-color)
                strokeDashArray: 0
                'y': 0
        series:
          - entity: sensor.hesc_diag_forecast_power
            name: Forecast
            yaxis_id: main
            type: area
            color: '#8B5CF6'
            opacity: 0.45
            stroke_width: 2
            unit: W
            float_precision: 0
            extend_to: false
            show:
              in_header: false
              legend_value: false
            transform: |
              const value = Number(x);

              if (
                !Number.isFinite(value) ||
                value < 0 ||
                value > 50000
              ) {
                return null;
              }

              return value;
            group_by:
              func: avg
              duration: 5min
              fill: zero
              start_with_last: false
          - entity: sensor.hesc_diag_pv_power
            name: PV actual
            yaxis_id: main
            type: area
            color: '#F59E0B'
            opacity: 0.9
            stroke_width: 2
            unit: W
            float_precision: 0
            extend_to: false
            show:
              in_header: false
              legend_value: false
            transform: |
              const value = Number(x);

              if (
                !Number.isFinite(value) ||
                value < 0 ||
                value > 50000
              ) {
                return null;
              }

              return value;
            group_by:
              func: avg
              duration: 5min
              fill: zero
              start_with_last: false
          - entity: sensor.hesc_diag_ev_power
            name: EV charging
            yaxis_id: main
            type: area
            color: '#06B6D4'
            opacity: 0.55
            stroke_width: 2
            unit: W
            float_precision: 0
            extend_to: false
            show:
              in_header: false
              legend_value: false
            transform: |
              const value = Number(x);

              if (
                !Number.isFinite(value) ||
                value < 0 ||
                value > 50000
              ) {
                return null;
              }

              // Mirrored below zero, like the HPVC power flow chart.
              return -value;
            group_by:
              func: avg
              duration: 5min
              fill: zero
              start_with_last: false
          - entity: sensor.hesc_diag_pv_power
            name: Solar
            yaxis_id: raw_header
            type: line
            color: '#F59E0B'
            opacity: 0
            stroke_width: 0
            unit: W
            float_precision: 0
            extend_to: false
            show:
              in_header: true
              name_in_header: true
              legend_value: false
            data_generator: |
              const value = Number(entity.state);

              if (
                !Number.isFinite(value) ||
                value < 0 ||
                value > 50000
              ) {
                return [];
              }

              return [[Date.now(), value]];
          - entity: sensor.hesc_diag_forecast_power
            name: Forecast
            yaxis_id: raw_header
            type: line
            color: '#8B5CF6'
            opacity: 0
            stroke_width: 0
            unit: W
            float_precision: 0
            extend_to: false
            show:
              in_header: true
              name_in_header: true
              legend_value: false
            data_generator: |
              const value = Number(entity.state);

              if (
                !Number.isFinite(value) ||
                value < 0 ||
                value > 50000
              ) {
                return [];
              }

              return [[Date.now(), value]];
          - entity: sensor.hesc_diag_ev_power
            name: EV
            yaxis_id: raw_header
            type: line
            color: '#06B6D4'
            opacity: 0
            stroke_width: 0
            unit: W
            float_precision: 0
            extend_to: false
            show:
              in_header: true
              name_in_header: true
              legend_value: false
            data_generator: |
              const value = Number(entity.state);

              if (
                !Number.isFinite(value) ||
                value < 0 ||
                value > 50000
              ) {
                return [];
              }

              return [[Date.now(), value]];
          - entity: input_number.hesc_p_start
            name: Start threshold
            yaxis_id: main
            type: line
            color: '#94A3B8'
            opacity: 1
            stroke_width: 1
            unit: W
            float_precision: 0
            extend_to: false
            show:
              in_header: false
              legend_value: false
            stroke_dash: 6
            data_generator: |
              const v = Number(entity.state);
              if (!Number.isFinite(v)) { return []; }
              return [[start.getTime(), v], [end.getTime(), v]];
        visibility:
          - condition: state
            entity: binary_sensor.hesc_configuration_valid
            state: 'on'
      - type: grid
        cards:
          - type: custom:apexcharts-card
            section_mode: true
            header:
              show: true
              show_states: true
              colorize_states: true
              title: 🔆 Solar charging forecast
            graph_span: 48h
            update_interval: 1min
            span:
              start: day
            apex_config:
              chart:
                height: 210px
                animations:
                  enabled: false
                toolbar:
                  show: false
                zoom:
                  enabled: false
                pan:
                  enabled: false
              annotations:
                xaxis:
