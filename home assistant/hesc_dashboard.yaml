            features_position: bottom
            grid_options:
              columns: 6
              rows: auto
          - type: tile
            entity: input_number.hesc_plan_charge_kw
            name: Grid charging power
            features:
              - type: numeric-input
                style: buttons
            features_position: bottom
            grid_options:
              columns: 6
              rows: auto
      - type: grid
        column_span: 3
        cards:
          - type: markdown
            content: |-
              {%- set r = state_attr('sensor.hesc_charge_plan', 'plan') -%}{%- set p = r if r is mapping else (r | from_json if r else {}) -%}
              {%- set on = p.active | default(false) -%}
              {%- set q = p.quarters | default(0) -%}
              {%- set st = states('input_text.hesc_plan_status') -%}
              {%- set solo = st.startswith('EV already charging') -%}
              <ha-alert alert-type="info">{{ 'EV is already charging by itself (e.g. on solar). The plan watches and does not take over. Need full power now? Start it in your charger app.' if solo else ('Planned: waiting for the first planned quarter' if (st.startswith('Finished') and q > 0) else st) }}</ha-alert>

              <center><b>{{ 'ACTIVE PLAN' if on else 'PLAN (not active)' }}</b> · ready by <b>{{ p.deadline_text | default('–') }}</b>{{ ' (every week)' if p.source == 'repeating' else ' (this day, every week)' }}</center>

              | CHARGING TIME | ENERGY PRICE |
              |:--|--:|
              | <font size="6" color="#22c55e"><b>{{ '–' if solo else (p.charge_time | default('–') ~ ' h') }}</b></font> @ {{ p.kw | default('–') }} kW | <font size="6" color="#22c55e"><b>{{ (p.avg_price_ct | string | replace('.', state_attr('sensor.hesc_prices', 'decimal') or ',')) ~ ' ' ~ (state_attr('sensor.hesc_prices', 'minor') or 'ct') ~ '/kWh' if (p.avg_price_ct is not none and q > 0 and not solo) else '–' }}</b></font> |

              | BATTERY NOW | GOAL | STILL NEEDED | STATUS |
              |:--|:--|:--|:--|
              | <font size="4"><b>{{ (p.soc | round(0) | int ~ '%') if p.soc is not none else '?' }}</b></font> | <font size="4"><b>{{ p.goal | default('–') }}%</b></font> | <font size="4"><b>{{ p.need_kwh | default(0) }} kWh</b></font>{{ ' (☀ ~' ~ p.solar_kwh ~ ' kWh sun)' if (p.solar_kwh | default(0)) > 0 else '' }}{{ '' if solo else (' · ' ~ (p.quarters | default(0)) ~ ' × 15 min grid') }}{{ ' · ⚠ not enough time left for the goal' if (on and not solo and (p.short_of_time | default(false))) else '' }} | <font size="4" color="{{ '#22c55e' if on else '#cbd5e1' }}"><b>{{ '✅ already there' if (p.need_kwh is defined and p.need_kwh == 0 and p.soc is not none) else ('☀ charging by itself' if (on and solo) else (('⏳ planned' if on else '💤 preview') if p.quarters | default(0) > 0 else '–')) }}</b></font> |
              {%- if p.prices_complete is defined and not p.prices_complete %}

